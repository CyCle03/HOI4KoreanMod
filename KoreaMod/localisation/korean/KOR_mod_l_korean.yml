 ### 이벤트 ###
 korea_triggers.1.t: "일장기 말소 사건"
 korea_triggers.1.d: "베를린에서 마라톤을 우승한 청년의 사진이 신문에 실렸다. 가슴의 일장기가 지워져 있었다.\n\n총독부는 신문사를 정간시켰다. 편집자들이 잡혀갔다. 지워진 것은 국기 하나였지만, 사람들이 본 것은 그 자리에 있어야 했던 다른 무엇이었다.\n\n이 자리에서 어느 편에 서느냐가 앞으로 열릴 길을 정한다."
 korea_triggers.1.a: "총독부 편에 선다."
 korea_triggers.1.b: "신문을 옹호한다."
 korea_triggers.1.c: "아무 말도 하지 않는다."
 korea_triggers.2.t: "카이로 선언"
 korea_triggers.2.d: "세 나라가 조선의 자유와 독립을 결의했다고 발표했다.\n\n다만 문구는 ‘적절한 시기에(in due course)’였다. 필리핀에는 1946년이라는 날짜가 적혀 있었다. 조선에는 부사 하나가 왔다.\n\n그 부사가 앞으로 몇 년을 결정한다."
 korea_triggers.2.a: "날짜가 없다는 것을 우리가 채운다."
 korea_triggers.2.b: "제국은 이 발표를 인정하지 않는다."

 korea_politics.3.t: "좌우합작 교섭"
 korea_politics.3.d: "충칭과 옌안이 같은 방에 앉았다. 같은 적을 두고도 다른 나라를 그리고 있다."
 korea_politics.3.a: "어느 쪽이든 하나를 골라야 한다."
 korea_politics.4.t: "임시정부의 주석"
 korea_politics.4.d: "이승만은 워싱턴에 있고 김구는 충칭에 있다. 승인을 얻는 데는 앞의 사람이 낫고, 사람을 모으는 데는 뒤의 사람이 낫다."
 korea_politics.4.a: "이승만을 그대로 둔다."
 korea_politics.4.b: "김구를 세운다."
 korea_politics.5.t: "황실의 귀환"
 korea_politics.5.d: "돌아올 수 있는 사람은 둘이다.\n\n영친왕 이은은 일본 육군 중장이다. 그가 세우는 나라는 독립국이 아니라 제국 안의 자치령이 될 것이다.\n\n의친왕 이강은 상해로 망명하려다 붙잡힌 적이 있다. 그를 세우면 왕조는 상징으로만 남는다."
 korea_politics.5.a: "영친왕 이은."
 korea_politics.5.b: "의친왕 이강."
 korea_politics.6.t: "대한국 국제 재선포"
 korea_politics.6.d: "1899년의 국제를 다시 읽는다. 조문은 그대로인데 읽는 사람이 달라졌다."
 korea_politics.6.a: "선포한다."

 korea_industry.1.t: "조선 산업 5개년 계획"
 korea_industry.1.d: "만주국이 쓴 방식 그대로다. 셋 중 하나를 고르고 나머지 둘은 이 5개년 동안 잠긴다."
 korea_industry.1.a: "중화학 — 흥남을 축으로."
 korea_industry.1.b: "군수 — 만드는 즉시 쓴다."
 korea_industry.1.c: "항공 — 조립까지만."

 korea_triggers.3.t: "병참기지"
 korea_triggers.3.d: "베이징 교외의 다리에서 총성이 울렸고, 사흘 만에 전선이 화북 전체로 벌어졌다.\n\n반도에서 달라진 것은 지도가 아니라 용도다. 여기서 캐는 것, 여기서 만드는 것, 이윽고 여기서 태어나는 사람까지 바다 건너로 실려 갈 물자로 다시 계산된다.\n\n총독부는 이것을 병참기지화라고 불렀다. 틀린 말은 아니었다."
 korea_triggers.3.a: "총후의 의무를 다한다."
 korea_triggers.3.b: "전선이 길어질수록 뒤는 비는 법이다."
 korea_triggers.3.c: "어느 쪽에도 이름을 올리지 않는다."
 korea_triggers.4.t: "대일 선전성명서"
 korea_triggers.4.d: "진주만에서 하루가 지났다. 충칭의 임시정부가 일본에 선전을 포고했다.\n\n군대라고는 광복군 몇 개 지대뿐이고, 그 지대마저 중국군의 지휘를 받는다. 그래도 선전포고는 문서로 남고, 문서가 있어야 나중에 자리를 요구할 수 있다.\n\n반도에서는 같은 날 등화관제가 시작됐다."
 korea_triggers.4.a: "선전을 포고한다. 뒷일은 문서가 한다."
 korea_triggers.4.b: "제국의 전쟁이 우리 전쟁이 된다."
 korea_triggers.4.c: "어느 쪽이든 전쟁은 여기까지 온다."
 korea_triggers.5.t: "조선어학회 사건"
 korea_triggers.5.d: "사전을 만들던 사람들이 잡혀갔다. 죄목은 내란이다.\n\n1942년의 기준으로는 틀린 죄목이 아니다. 사전은 그 말을 읽을 사람이 나중에도 있으리라는 것을 전제로 만들어지기 때문이다.\n\n원고는 아직 인쇄소에 있다."
 korea_triggers.5.a: "원고를 숨긴다."
 korea_triggers.5.b: "학회를 내어준다."
 korea_triggers.6.t: "징병제 시행"
 korea_triggers.6.d: "총독부가 삼십 년을 미뤄 온 것을 꺼냈다. 식민지의 손에 총을 쥐여 주는 일은 한 번 하면 되돌릴 수 없기 때문이다.\n\n이제 미룰 여유가 없다. 첫 영장이 면사무소에 도착했다.\n\n영장을 받은 청년들이 어디로 가는지는 아직 정해지지 않았다."
 korea_triggers.6.a: "할당을 채운다."
 korea_triggers.6.b: "산으로 보낸다."
 korea_triggers.6.c: "떨어지는 대로 둔다."
 korea_industry.2.t: "수풍 발전 개시"
 korea_industry.2.d: "압록강을 막아 세운 댐이 전기를 내기 시작했다. 테네시강 유역 바깥에서는 세계에서 가장 큰 댐이고, 공사에 동원된 인부의 수는 기록마다 다르다.\n\n송전선은 두 방향으로 놓여 있다. 하나는 흥남과 겸이포로, 하나는 해협 건너로."
 korea_industry.2.a: "본토로 보낸다."
 korea_industry.2.b: "반도에서 쓴다."
 korea_politics.7.t: "자치의회의 마지막 날"
 korea_politics.7.d: "본토가 무너졌다. 자치의회는 제국의 법으로 세워졌고, 그 법을 보증하던 것이 오늘 사라졌다.\n\n청사 밖에서는 이미 인민위원회가 도청과 경찰서를 접수하고 있다. 붉은 완장을 찬 사람들 중에는 어제까지 이 건물에서 일하던 사람도 섞여 있다.\n\n남은 선택은 넘겨줄 것인가, 아니면 남은 총검으로 며칠을 더 벌 것인가뿐이다."
 korea_politics.7.a: "인민위원회에 넘긴다."
 korea_politics.7.b: "남은 총검으로 버틴다."
 KOR_dominion_fallen_tt: "§R자치령이 해산된다.§!"
 KOR_rear_base_mobilisation: "총후 동원"
 KOR_rear_base_mobilisation_desc: "반도의 공장은 이제 반도를 위해 돌지 않는다. 짓는 속도는 빨라지고, 만든 것은 여기 남지 않는다."
 KOR_conscripted_class: "징집된 세대"
 KOR_conscripted_class_desc: "면사무소마다 명부가 있다. 명부에 오른 사람은 훈련소로 가고, 명부를 만든 사람은 그 마을에서 계속 살아야 한다."
 KOR_bayonet_authority: "총검의 권위"
 KOR_bayonet_authority_desc: "명령을 보증하는 것이 더는 법이 아니다. 아직 듣는 사람이 있는 이유는 아직 총검이 있기 때문이다."
 KOR_sponsor_strain: "전력을 돌려썼다"
 KOR_allied_standing: "연합국 내 위상"
 KOR_allied_standing_desc: "어디의 누구인지 아는 정부라는 것은 회의장에서 값이 나간다. 승인 게이지에 비례하며, 0이면 아무것도 아니다."
 KOR_united_front_strain: "합작의 부담"
 KOR_united_front_strain_desc: "저울은 50에 있을 때 아무 대가도 치르지 않는다. 어느 쪽으로든 1점을 밀 때마다 더는 말을 듣지 않는 운동이 1점씩 늘고, 그 값은 남은 절반의 열의로 치러진다."
 KOR_military_academy_idea: "사관학교"
 KOR_military_academy_idea_desc: "장교를 만드는 곳이 생겼다. 늦었지만 생기기는 했다."
