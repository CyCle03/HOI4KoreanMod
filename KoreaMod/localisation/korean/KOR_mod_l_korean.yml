 ### 시작 국민 정신 ###
 KOR_colonial_supply_base: "식민지 병참기지"
 KOR_colonial_supply_base_desc: "반도는 공장을 짓기 위한 땅이 아니라 본토로 실어 보내기 위한 땅이다. 건설과 채굴은 빨라지지만 나오는 것의 절반은 여기 남지 않는다.\n\n현재 유출률: §R[?KOR_leak_display|0]%§!\n산업 중점을 완료할 때마다 5%p씩 되찾는다."
 KOR_manpower_extraction: "인적 자원의 공출"
 KOR_manpower_extraction_desc: "징용으로 청년층이 반도 밖에 있다. 인구는 있는데 손이 없다."
 KOR_governorate_police: "총독부 치안 체제"
 KOR_governorate_police_desc: "경찰이 정치보다 먼저 온다. 저항은 눌리지만 정치라 부를 것도 함께 눌린다."
 KOR_divided_movement: "분열된 독립운동"
 KOR_divided_movement_desc: "충칭·옌안·하바롭스크·호놀룰루가 서로 다른 말을 한다."
 KOR_army_hq_veto: "조선군사령부 거부권"
 KOR_army_hq_veto_desc: "조선주차군 사령부가 반도의 모든 군사 결정을 쥐고 있다. 협정을 맺거나 몰아내야 풀린다.\n\n바닐라에는 사단 편성을 금지하는 modifier가 없다. 그래서 훈련·보충·경험이 사실상 마비될 만큼 깎아 같은 결과를 만든다."
 KOR_colonial_education: "식민지 교육 체제"
 KOR_colonial_education_desc: "고등 이공 교육 기관이 사실상 하나뿐이다."
 KOR_colonial_education_eased: "식민지 교육 체제 (완화)"
 KOR_colonial_education_eased_desc: "경성제대 이공학부가 문을 열었다. 여전히 부족하지만 예전만큼은 아니다."
 KOR_officer_shortage_1: "장교단의 부재"
 KOR_officer_shortage_1_desc: "인력은 프랑스급인데 지휘할 사람이 없다. 3단계로 완화되며, 완전히는 사라지지 않는다. (1단계)"
 KOR_officer_shortage_2: "장교단의 부재 (2단계)"
 KOR_officer_shortage_2_desc: "학교가 다시 열렸다. 아직 모자라지만 전보다는 낫다."
 KOR_officer_shortage_3: "장교단의 부재 (3단계)"
 KOR_officer_shortage_3_desc: "사관학교가 섰다. 여기가 끝이다 — 완전히 사라지지는 않는다."

 ### 중점으로 얻는 국민 정신 ###
 KOR_imperial_dominion: "제국 내 자치령"
 KOR_imperial_dominion_desc: "독립국은 아니다. 그러나 더 이상 행정구역도 아니다."
 KOR_north_china_base: "화북 근거지"
 KOR_north_china_base_desc: "산 하나를 통째로 근거지로 쓴다."
 KOR_samgyunism: "삼균주의"
 KOR_samgyunism_desc: "정치·경제·교육의 균등. 임시정부의 건국 강령."
 KOR_shadow_of_the_throne: "황실의 그림자"
 KOR_shadow_of_the_throne_desc: "왕이 없는 왕조가 아직 사람들의 기억 속에 남아 있다."
 KOR_national_capital: "민족자본의 협조"
 KOR_national_capital_desc: "경성방직과 화신이 장부를 열었다."
 KOR_coastal_navy: "연안 해군"
 KOR_coastal_navy_desc: "반도 국가인데 함대를 만들지 않기로 했다. 구축함 아래로만."
 KOR_peoples_committees: "전국 인민위원회 망"
 KOR_peoples_committees_desc: "총을 먼저 든 것이 아니라 행정을 먼저 접수했다."
 JAP_korean_integration: "조선의 내지 편입"
 JAP_korean_integration_desc: "반도를 통합 괴뢰국으로 떼어낸 대신, 인력과 공업 지분을 그쪽에서 받는다."

 KOR_survey_effort: "자원 조사단"
 KOR_survey_effort_desc: "무엇이 어디에 묻혀 있는지부터 안다."
 KOR_underground_cells: "지하 조직망"
 KOR_underground_cells_desc: "합법 정당이 없으니 남는 것은 세포뿐이다."
 KOR_education_drive: "교육령 개정"
 KOR_education_drive_desc: "가르치는 내용은 정해져 있지만 가르치기는 한다."
 KOR_labor_conscription: "국민징용령"
 KOR_labor_conscription_desc: "사람을 뽑아 쓰는 데는 동의를 구하지 않는다."
 KOR_restoration_army_spirit: "한국광복군"
 KOR_restoration_army_spirit_desc: "정원을 채운 적이 없는 군대. 그래도 군대다."
 KOR_yanan_logistics: "옌안 보급선"
 KOR_yanan_logistics_desc: "적게 먹고 멀리 간다."
 KOR_taihang_base: "태항산 근거지"
 KOR_taihang_base_desc: "산이 요새를 대신한다."
 KOR_homeland_raiders: "국내 진공 유격대"
 KOR_homeland_raiders_desc: "국경을 넘는 것이 목적이 아니라 국경이 있다는 것을 상기시키는 것이 목적이다."
 KOR_land_reform_idea: "토지개혁"
 KOR_land_reform_idea_desc: "지주가 사라지면 소작인은 병사가 된다."
 KOR_gubon_sincham_idea: "구본신참"
 KOR_gubon_sincham_idea_desc: "옛것을 근본으로 삼고 새것을 참고한다."
 KOR_perpetual_neutrality_idea: "영세중립"
 KOR_perpetual_neutrality_idea_desc: "누구의 편도 들지 않는 대가로 누구의 도움도 받지 않는다."
 KOR_labor_council_idea: "노동조합 전국평의회"
 KOR_labor_council_idea_desc: "공장이 스스로 굴러가는 법을 배운다."
 KOR_local_autonomy_idea: "지방 자치"
 KOR_local_autonomy_idea_desc: "군청이 먼저 바뀌면 나라는 나중에 바뀐다."
 KOR_equidistance_idea: "미소 등거리"
 KOR_equidistance_idea_desc: "양쪽에서 같은 거리를 유지한다는 것은 양쪽 모두에게 미움받는다는 뜻이다."
 KOR_pr_ceiling: "행정의 나라"
 KOR_pr_ceiling_desc: "지키기는 쉽고 나가기는 불가능한 나라. 강점을 군사력으로 번역하지 않았다."
 KOR_rice_production_plan: "산미증식계획"
 KOR_rice_production_plan_desc: "쌀은 늘지만 먹는 사람은 늘지 않는다."
 KOR_cotton_and_wool: "남면북양"
 KOR_cotton_and_wool_desc: "남쪽에 목화, 북쪽에 양."
 KOR_supung_power: "수풍 발전"
 KOR_supung_power_desc: "당대 동양 최대의 수력 발전소."
 KOR_aoji_fuel: "아오지 인조석유"
 KOR_aoji_fuel_desc: "석탄에서 기름을 짜낸다."
 KOR_chosen_heavy_industries: "조선중공업"
 KOR_chosen_heavy_industries_desc: "부산. 구축함 이하만 만들 수 있다."
 KOR_regional_specialization: "지역 특화"
 KOR_regional_specialization_desc: "모든 것을 모든 곳에서 만들려 하지 않는다."
 KOR_double_tracked_railway: "철도 복선화"
 KOR_double_tracked_railway_desc: "경부선과 경의선이 양방향이 된다."
 KOR_world_trade: "세계 속의 조선"
 KOR_world_trade_desc: "처음으로 스스로의 이름으로 거래한다."
 KOR_standing_army: "현역 사단"
 KOR_standing_army_desc: "상비군이 생겼다."
 KOR_artillery_and_supply: "포병과 병참"
 KOR_artillery_and_supply_desc: "쏘는 것보다 옮기는 것이 어렵다."
 KOR_guerrilla_doctrine_idea: "유격전 교리"
 KOR_guerrilla_doctrine_idea_desc: "산과 밤을 쓴다."
 KOR_uiyeoldan_idea: "의열단의 유산"
 KOR_uiyeoldan_idea_desc: "폭탄 하나가 사단 하나보다 멀리 간 적이 있었다."
 KOR_manchurian_bases_idea: "만주 국경 거점"
 KOR_manchurian_bases_idea_desc: "국경은 선이 아니라 지대다."
 KOR_port_repair: "항만 정비"
 KOR_port_repair_desc: "진남포와 원산."
 KOR_coastal_defence_idea: "연안 방어 전대"
 KOR_coastal_defence_idea_desc: "먼바다는 포기했다."
 KOR_wolfpack_idea: "통상 파괴"
 KOR_wolfpack_idea_desc: "이길 수 없다면 굶긴다."
 KOR_aviation_legacy: "노백린의 유산"
 KOR_aviation_legacy_desc: "비행학교가 먼저 있었고 비행기는 나중에 왔다."
 KOR_foreign_pilots: "국제 의용 비행대"
 KOR_foreign_pilots_desc: "말이 통하지 않아도 방향은 통한다."
 KOR_airfield_expansion: "평양 비행장"
 KOR_airfield_expansion_desc: "활주로가 길어졌다."
 KOR_administrative_takeover: "행정권 접수"
 KOR_administrative_takeover_desc: "총독부의 서류함이 그대로 넘어왔다."
 KOR_hasty_levies: "자위대"
 KOR_hasty_levies_desc: "훈련도 장비도 없이 머릿수만 있다."
 KOR_committee_autonomy_idea: "인민위원회 자치"
 KOR_committee_autonomy_idea_desc: "점령군의 명령보다 마을의 결정이 먼저 도착한다."
 KOR_anti_trusteeship_idea: "신탁통치 반대"
 KOR_anti_trusteeship_idea_desc: "거리에는 사람이 가득하고 협상장에는 아무도 없다."
 KOR_hq_infiltration: "사령부 내부 포섭"
 KOR_hq_infiltration_desc: "적의 회의록을 우리가 먼저 읽는다."
 KOR_resistance_in_korea: "조선의 저항"
 KOR_resistance_in_korea_desc: "반도가 조용하지 않다."
 KOR_silence_cost: "침묵의 대가"
 KOR_silence_cost_desc: "아무 편도 들지 않은 사람은 양쪽 모두에게 설명을 요구받는다."
 KOR_plan_chemical: "5개년 계획 · 중화학"
 KOR_plan_chemical_desc: "흥남을 축으로 삼는다."
 KOR_plan_munitions: "5개년 계획 · 군수"
 KOR_plan_munitions_desc: "만드는 것이 곧 쓰는 것이다."
 KOR_plan_aviation: "5개년 계획 · 항공"
 KOR_plan_aviation_desc: "조립까지는 가능하다. 설계는 아니다."
 KOR_trusteeship: "신탁통치"
 KOR_trusteeship_desc: "‘적절한 시기에’ 독립한다. 그 시기는 명시되지 않았다."
 KOR_stripped_industry: "반출된 설비"
 KOR_stripped_industry_desc: "기계는 배에 실렸고 건물만 남았다."

