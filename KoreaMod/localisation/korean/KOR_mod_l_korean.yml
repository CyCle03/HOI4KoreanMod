 ### 게임 규칙 ###
 RULE_GROUP_KOR: "조선"
 RULE_KOR_DIFFICULTY: "조선의 국력"
 RULE_KOR_DIFFICULTY_DESC: "고증과 재미의 균형을 시작 화면에서 고른다. 중점 트리는 세 경우 모두 같고, 바뀌는 것은 시작 국민정신의 수치와 초기 자산뿐이다."
 RULE_KOR_DIFFICULTY_HISTORICAL: "고증"
 RULE_KOR_DIFFICULTY_HISTORICAL_DESC: "공장 유출 50%, 장교단 페널티 최대, 사단 편제 3개 제한. 종전까지 살아남는 것이 목표다."
 RULE_KOR_DIFFICULTY_BALANCED: "균형"
 RULE_KOR_DIFFICULTY_BALANCED_DESC: "유출 35%, 장교단 페널티 절반, 시작 민수공장 +3. 동유럽 마이너 수준."
 RULE_KOR_DIFFICULTY_EMPOWERED: "강화"
 RULE_KOR_DIFFICULTY_EMPOWERED_DESC: "유출 없음, 장교단 페널티 없음, 공장 대폭 증가. 폴란드급 중견국 — 멀티 또는 첫 플레이용."
 RULE_KOR_START_MODE: "반도의 시작 상태"
 RULE_KOR_START_MODE_DESC: "1936년 지도를 건드릴지 여부. 이 설정만이 일본에 영향을 준다."
 RULE_KOR_START_MODE_LIBERATION: "해방국 전용 (안전)"
 RULE_KOR_START_MODE_LIBERATION_DESC: "지도를 그대로 둔다. 반도는 일본령이고 조선은 해방 가능 국가로 남으며, 중점 트리는 해방된 뒤부터 돌아간다. 일본의 AI는 전혀 영향받지 않는다."
 RULE_KOR_START_MODE_GOVERNORATE: "조선총독부 (기본)"
