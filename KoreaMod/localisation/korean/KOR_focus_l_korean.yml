l_korean:

 KOR_resource_survey: "조선의 자원 조사"
 KOR_resource_survey_desc: "총독부가 반도의 땅속을 처음부터 다시 센다. 지질조사소가 만든 것은 지도가 아니라 목록이었다 — 무엇이 어디에 얼마나 묻혀 있고 그것을 꺼내는 데 얼마가 드는지. 조선이 무엇을 가졌는지를 조선보다 총독부가 먼저 알게 된다."
 KOR_logistics_base: "병참기지화"
 KOR_logistics_base_desc: "미나미 총독이 반도에 붙인 이름이다. 조선은 이제 식민지이면서 동시에 전선의 뒤쪽이고, 뒤쪽에서 만들어진 것은 뒤쪽에 남지 않는다. 공장은 실제로 늘어난다. 늘어난 것이 누구의 것인지는 다른 문제다."
 KOR_underground_network: "지하 조직망"
 KOR_underground_network_desc: "1930년대의 검거는 조직을 없앤 것이 아니라 지하로 밀어 넣었다. 남은 것은 이름도 강령도 없이 서로를 한 사람 건너로만 아는 연결이다. 느리고, 좁고, 무너뜨리기 어렵다."
 CHO_national_mobilization: "국민정신총동원"
 CHO_national_mobilization_desc: "1938년, 총독부가 국민정신총동원조선연맹을 세운다. 열 집을 하나로 묶은 애국반이 반도 전체를 덮고 아침마다 궁성요배와 서사를 시킨다. 동원되는 것은 물자가 아니라 하루하루의 시간이다."
 CHO_imperial_subject_oath: "황국신민서사"
 CHO_imperial_subject_oath_desc: "1937년부터 학교와 관청과 공장에서 매일 소리 내어 외운다. 세 줄짜리 문장이고 어린이용과 성인용이 따로 있다. 믿게 만드는 것이 목적이 아니라 매일 말하게 만드는 것이 목적이다."
 CHO_education_ordinance: "조선교육령 개정"
 CHO_education_ordinance_desc: "제3차 조선교육령. 조선어를 필수과목에서 빼고 수의과목으로 내린다. 학교 이름에서 조선인과 일본인의 구분을 없앤 것도 같은 개정에 들어 있다 — 차별을 없애는 방식이 조선어를 없애는 것이었다."
 CHO_name_change_order: "창씨개명"
 CHO_name_change_order_desc: "1940년 2월부터 여섯 달. 조선식 성을 일본식 씨로 바꾸게 한다. 법령은 임의라고 적었지만 바꾸지 않으면 아이가 학교에 들어가지 못하고 배급을 받지 못했다. 그러고도 여덟 집 중 한 집은 끝까지 바꾸지 않았다."
 CHO_korean_bureaucrats: "조선인 관료 등용"
 CHO_korean_bureaucrats_desc: "총독부 안에 조선인 자리를 늘린다. 도지사까지 오른 조선인은 실제로 있었고 그 위는 없었다. 자리를 주는 것과 권한을 주는 것 사이의 거리가 이 정책의 전부다."
 CHO_army_volunteer_ordinance: "육군특별지원병령"
 CHO_army_volunteer_ordinance_desc: "1938년, 조선인이 일본 육군에 지원할 수 있게 된다. 지원자는 해마다 정원의 수십 배였다. 총독부는 그 숫자를 충성의 증거로 읽었고, 지원한 사람들에게는 대개 다른 일자리가 없었다."
 CHO_labor_mobilization: "국민징용령"
 CHO_labor_mobilization_desc: "1939년의 국민징용령이 조선에 적용된다. 모집에서 관 알선으로, 관 알선에서 징용으로 이름이 세 번 바뀌는 동안 실제로 달라진 것은 거절할 수 있는가뿐이었다. 끌려간 사람들은 규슈의 탄광과 사할린으로 갔다."
 CHO_navy_volunteers: "해군 특별지원병"
 CHO_navy_volunteers_desc: "1943년, 육군에 이어 해군도 조선인을 받는다. 전황이 나빠질수록 문턱이 낮아졌다는 뜻이다. 제국이 조선인을 신뢰하게 되어서가 아니라 다른 데서 사람을 구할 수 없어서였다."
 CHO_conscription_act: "징병제 실시"
 CHO_conscription_act_desc: "1944년, 지원이 아니라 징병이 된다. 총독부가 삼십 년 동안 미뤄 온 일이다. 식민지에 총을 쥐여 주는 일은 한 번 하면 되돌릴 수 없기 때문이었고, 되돌릴 수 없다는 것을 알면서도 할 수밖에 없는 데까지 왔다."
 CHO_diet_election_law: "중의원 선거법"
 CHO_diet_election_law_desc: "1945년 4월, 조선에 중의원 의석을 준다. 인구 2500만에 스물세 석이고 선거권은 세금을 일정액 이상 내는 남자에게만 있었다. 선거가 실제로 치러지기 전에 제국이 먼저 끝났다."
 CHO_autonomous_assembly: "조선 자치의회"
 CHO_autonomous_assembly_desc: "총독부가 마지막으로 내놓을 수 있는 것. 의회는 세워지지만 총독의 거부권 아래에 있고, 그 총독은 도쿄가 임명한다. 이 정부가 제국보다 오래 살지 못한다는 것은 이 자리에서 이미 정해져 있다."
 KOR_national_front_league: "조선민족전선연맹"
 KOR_national_front_league_desc: "1937년 난징에서 김원봉이 좌파 단체들을 하나로 묶는다. 임시정부 계열과는 별개의 연합이고, 연합이 둘로 존재한다는 사실 자체가 이 시기 독립운동의 상태였다."
 KOR_volunteer_corps: "조선의용대 결성"
 KOR_volunteer_corps_desc: "1938년 10월 10일 한커우에서 창설된 조선의용대는 중국 땅에서 조선인이 만든 첫 정규 무장부대다. 국민정부의 지원을 받았고, 그래서 국민정부가 정한 곳에서만 싸울 수 있었다. 몇 해 뒤 대원 대부분은 북쪽으로 떠난다."
 KOR_left_right_negotiation: "좌우합작 교섭"
 KOR_left_right_negotiation_desc: "충칭과 옌안이 같은 방에 앉는다. 같은 적을 두고 있다는 것만으로는 같은 나라를 그리게 되지 않는다는 사실이 이 자리에서 확인된다. 한쪽을 고르면 다른 쪽은 다시 열리지 않는다."
 KPG_unify_kip: "한국독립당 통합"
 KPG_unify_kip_desc: "1940년 충칭에서 한국국민당과 한국독립당과 조선혁명당이 하나로 합친다. 김구가 이끄는 단일 정당이 생기고, 임시정부는 스무 해 만에 처음으로 자기를 떠받치는 당을 갖는다."
 KPG_samgyun: "삼균주의 선포"
 KPG_samgyun_desc: "조소앙의 삼균주의 — 정치와 경제와 교육의 균등. 1941년 건국강령의 뼈대가 된다. 아직 나라가 없는 정부가 그 나라의 토지제도와 교육제도를 먼저 적어 둔 문서다."
 KPG_western_commission: "구미위원부 설치"
 KPG_western_commission_desc: "1919년 워싱턴에 세운 구미위원부. 이승만이 맡았고 하는 일은 미국 정계에 조선을 설명하는 것이었다. 성과는 거의 없었지만, 스물다섯 해 뒤 승인 문제가 왔을 때 워싱턴에 전화를 걸 사람이 있는 유일한 조선 조직이었다."
 KPG_restoration_army: "한국광복군 창설"
 KPG_restoration_army_desc: "1940년 9월 17일 충칭에서 한국광복군이 창설된다. 총사령은 지청천. 병력은 처음에 서른 명 남짓이었고, 그 서른 명이 정부가 군대를 가졌다는 사실을 만들었다."
 KPG_kmt_agreement: "중국 국민정부 협정"
 KPG_kmt_agreement_desc: "국민정부가 광복군을 지원하는 대가로 행동준승 아홉 항을 요구한다. 광복군은 중국 군사위원회의 지휘를 받고 작전 지역도 중국이 정한다. 돈을 받는 군대가 누구의 군대인가에 대한 답이 여기 적혀 있다."
 KPG_recognition_diplomacy: "승인 외교전"
 KPG_recognition_diplomacy_desc: "정부로 인정받기 위한 교섭. 중국은 사실상 인정했으나 문서로는 하지 않았고, 미국은 조선인 망명 단체가 여럿이라는 이유로 어느 쪽도 인정하지 않았다. 승인은 얻어내는 것이 아니라 남이 주는 것이다."
 KPG_indian_mission: "인면전구공작대"
 KPG_indian_mission_desc: "1943년, 광복군 아홉 명이 영국군을 따라 인도와 버마 전선으로 간다. 하는 일은 일본어 문서 번역과 포로 심문과 선전방송이었다. 아홉 명이지만, 연합국의 전선에 조선인이 서 있었다는 기록이 된다."
 KPG_american_koreans: "미주 한인 동원"
 KPG_american_koreans_desc: "하와이와 캘리포니아의 조선인들이 임시정부의 돈줄이었다. 사탕수수밭과 과수원에서 일한 사람들이 보낸 돈으로 충칭의 정부가 유지됐다. 조직이 있었고 표가 있었다 — 미국 정치에서 표는 문서보다 빨리 움직인다."
 KPG_allied_recognition: "연합국 승인 획득"
 KPG_allied_recognition_desc: "연합국의 문서에 조선이 정부로 적히는 순간. 역사에서는 오지 않았다. 카이로 선언은 조선의 독립을 적으면서 시점을 적지 않았고, 시점 없는 약속은 약속한 쪽이 언제든 다시 읽을 수 있다."
 KPG_eagle_project: "독수리 작전"
 KPG_eagle_project_desc: "1945년, 미국 전략첩보국과 광복군이 함께 국내 진공을 준비한다. 훈련은 시안에서 이뤄졌고 첫 조가 떠나기 직전에 일본이 항복했다. 김구는 그 소식이 기쁘지 않았다고 적었다. 우리 손으로 들어가지 못했기 때문이다."
 KIL_found_league: "조선독립동맹 창립"
 KIL_found_league_desc: "1942년 7월 태항산에서 화북조선독립동맹이 선다. 위원장은 김두봉. 앞서 있던 화북조선청년연합회를 이어받은 조직이고, 이때부터 중국공산당의 근거지 안에 조선인의 정치조직이 따로 존재하게 된다."
 KIL_move_to_yanan: "옌안으로의 이동"
 KIL_move_to_yanan_desc: "국민정부 지역을 떠나 팔로군 쪽으로 넘어간다. 조선의용대 대원 대다수가 이 길을 택했고, 이유는 이념보다 단순했다. 남쪽에서는 일본군과 싸울 기회가 오지 않았기 때문이다."
 KIL_youth_school: "화북조선청년학교"
 KIL_youth_school_desc: "태항산에 조선인 간부를 길러 내는 학교를 연다. 가르친 것은 군사만이 아니라 정치이론과 조선어와 조직하는 법이었다. 여기서 배운 사람들이 해방 뒤 북쪽 행정의 상당 부분을 맡게 된다."
 KIL_volunteer_army: "조선의용군 편성"
 KIL_volunteer_army_desc: "조선의용대 화북지대가 조선의용군으로 다시 편성된다. 사령은 무정. 팔로군의 편제 안에 들어가지만 조선인 부대로 남고, 목표는 화북이 아니라 압록강 건너였다."
 KIL_taihang_base: "태항산 근거지"
 KIL_taihang_base_desc: "태항산은 산이 험해 토벌이 어렵고 화북 평야가 내려다보이는 자리다. 1941년 호가장에서 조선의용대원 넷이 전사한다. 근거지란 안전한 곳이 아니라 물러설 곳이 있는 곳이다."
 KIL_join_nauaa: "동북항일연군 참가"
 KIL_join_nauaa_desc: "만주의 동북항일연군에 합류한다. 조선인과 중국인이 한 부대에 섞여 있었고 지휘관도 섞여 있었다. 김일성이 이끈 제6사도 그 안에 있었다."
 KIL_pochonbo_raid: "보천보 습격"
 KIL_pochonbo_raid_desc: "1937년 6월 4일 밤, 국경을 넘어 함경남도 보천보의 주재소와 면사무소를 친다. 군사적 성과는 크지 않았지만 동아일보가 호외를 냈다. 국내 신문에 실렸다는 것 — 그것이 이 습격의 실제 성과였다."
 KIL_88th_brigade: "제88독립보병여단"
 KIL_88th_brigade_desc: "1942년, 만주에서 밀려난 항일연군 잔여 병력이 소련 극동에 모여 제88독립보병여단이 된다. 소련군 편제이고 소련군 계급장을 단다. 해방은 결국 이 여단이 소련군과 함께 들어오는 형태로 왔다."
 KIL_homeland_raiders: "국내 진공 유격대"
 KIL_homeland_raiders_desc: "압록강과 두만강을 건너 국내로 들어가는 부대를 만든다. 중국에서 싸우는 것과 조선에서 싸우는 것은 다른 일이다. 뒤쪽은 이겨도 물러설 곳이 없다."
 KIL_faction_unity: "양대 파벌 합작"
 KIL_faction_unity_desc: "옌안에서 온 사람들과 만주에서 온 사람들. 같은 이념이지만 다른 전쟁을 치렀고 다른 나라의 지원을 받았다. 이 둘을 합치는 일은 해방 뒤 북쪽에서 십오 년 동안 이어졌고, 끝은 합작이 아니었다."
 KIL_land_reform: "토지개혁"
 KIL_land_reform_desc: "지주의 땅을 거두어 부치는 사람에게 넘긴다. 반도 인구의 대부분이 소작농이었으므로 이것은 경제정책이기 이전에 누가 누구 편인지를 정하는 일이다. 되돌리기가 가장 어려운 종류의 개혁이다."
 YIH_dissolve_office: "이왕직 해체"
 YIH_dissolve_office_desc: "이왕직은 황실을 관리하는 관청이라는 이름을 달고 있었지만, 실제로 한 일은 궁내부를 해체하고 왕가를 일본 황족에 준하는 등급으로 편입시킨 것이었다. 간판을 내리는 일은 왕가를 되살리겠다는 선언이 아니다. 왕가를 관리하던 손을 떼어내는 것이고, 그 자리에 무엇이 들어설지는 아직 아무도 말하지 않았다."
 YIH_return_of_royals: "황실의 귀환"
 YIH_return_of_royals_desc: "누가 돌아오는가. 영친왕 이은은 도쿄에서 자랐고 일본 육군 중장이며 일본 황족과 결혼했다. 의친왕 이강은 1919년 상하이로 탈출하려다 안둥에서 붙잡혔다. 둘 다 고종의 아들이고, 같은 왕가에서 서로 다른 두 나라가 나온다."
 YIH_gwangmu_era: "광무 연호 복원"
 YIH_gwangmu_era_desc: "광무는 1897년 고종이 황제를 칭하며 세운 연호다. 연호를 되살리는 것은 달력을 바꾸는 일이고, 달력을 바꾸는 것은 어느 해부터 세느냐를 정하는 일이다. 1910년이 없었던 것으로 하고 세기 시작한다."
 YIH_reclaim_estates: "이왕직 재산 환수"
 YIH_reclaim_estates_desc: "이왕직이 관리하던 궁방전과 능묘와 재산을 되찾는다. 삼십 년 동안 그 재산은 왕가의 것이면서 동시에 총독부의 승인 없이는 한 뙈기도 팔 수 없는 것이었다. 소유와 처분이 다시 한 손에 모인다."
 YIH_jongmyo_rites: "종묘 제례 복원"
 YIH_jongmyo_rites_desc: "종묘의 제례는 식민지 기간에도 끊기지 않았으나 규모가 줄고 절차가 축소됐다. 다시 온전히 지내는 일은 종교 행사가 아니라 정통성의 주장이다. 이 왕조가 아직 끝나지 않았다는 주장."
 YIH_gubon_sincham: "구본신참"
 YIH_gubon_sincham_desc: "옛것을 근본으로 삼고 새것을 참고한다. 광무개혁의 표어였고, 서양의 제도를 들이되 군주의 자리는 건드리지 않겠다는 뜻이었다. 절반의 근대화를 부르는 가장 정중한 이름이다."
 YIH_reproclaim_empire: "대한국 국제 재선포"
 YIH_reproclaim_empire_desc: "1899년의 대한국 국제를 다시 선포한다. 제2조는 대한제국의 정치가 만세에 걸쳐 바뀌지 않는 전제정치라고 적었다. 여기서 되살리는 것은 나라가 아니라 그 문장이다."
 YIH_marshal_office: "원수부 재건"
 YIH_marshal_office_desc: "1899년 고종이 세운 원수부는 황제가 군대를 직접 지휘하기 위한 기구였다. 내각을 거치지 않는다는 뜻이고, 군대가 정부의 것이 아니라 황실의 것이라는 뜻이다."
 YIH_german_advisors: "독일 군사고문단 초빙"
 YIH_german_advisors_desc: "군대를 새로 만들려면 가르칠 사람이 필요하다. 대한제국은 러시아와 일본의 교관을 차례로 받았고, 그때마다 교관을 보낸 나라의 영향이 함께 들어왔다. 독일을 부르는 일은 그 계산을 한 번 더 하는 것이다."
 YIH_imperial_guard: "황실 근위대 창설"
 YIH_imperial_guard_desc: "시위대는 1907년 군대 해산 때 마지막까지 저항한 부대다. 남대문에서 박승환이 자결하고 병사들이 총을 들었다. 근위대를 다시 세우는 일은 그 자리에서 끊긴 것을 잇는 일이다."
 YIH_perpetual_neutrality: "영세중립 선언"
 YIH_perpetual_neutrality_desc: "1904년 대한제국은 국외중립을 선언했다. 러시아도 일본도 읽고 무시했다. 중립은 선언해서 되는 것이 아니라 남들이 지켜 줘야 되는 것이고, 지켜 줄 이유를 만드는 것이 이 선언의 실제 과제다."
 KPR_founding_league: "조선건국동맹"
 KPR_founding_league_desc: "1944년 8월, 여운형이 조선건국동맹을 만든다. 강령을 종이에 적지 않았고 명부도 만들지 않았다. 총독부 경찰이 끝내 실체를 잡지 못한 조직이며, 해방이 왔을 때 반도 안에서 곧바로 움직일 수 있었던 유일한 조직이었다."
 KPR_peasant_unions: "농민조합 재건"
 KPR_peasant_unions_desc: "1930년대의 혁명적 농민조합은 검거로 무너졌지만 사람은 마을에 남았다. 조합을 다시 세우는 일은 새 조직을 만드는 것이 아니라 이미 서로를 아는 사람들에게 다시 이름을 붙이는 일이다."
 KPR_labor_council: "노동조합 전국평의회"
 KPR_labor_council_desc: "공장과 부두의 노동조합을 전국 단위로 묶는다. 조선의 노동자는 대부분 일본인이 소유한 사업장에서 일했으므로, 노동조합은 세워지는 순간부터 노동 문제이면서 동시에 민족 문제였다."
 KPR_coalition_line: "좌우합작 노선"
 KPR_coalition_line_desc: "좌우 어느 쪽도 혼자서는 반도 전체를 대표하지 못한다는 판단. 여운형과 김규식이 실제로 이 길을 걸었고 두 사람 다 자기 진영에서 배신자로 불렸다. 가운데 서 있는 일은 양쪽에서 맞는 일이다."
 KPR_security_corps: "치안대 조직"
 KPR_security_corps_desc: "총독부 경찰이 손을 놓은 자리에 치안대가 선다. 무장은 빈약했고 훈련은 없었지만 그해 여름 몇 주 동안 반도의 질서를 실제로 유지한 것은 이들이었다. 권력은 선포로 오지 않고 아무도 하지 않는 일을 하면서 온다."
 KPR_local_autonomy: "지방 자치 확대"
 KPR_local_autonomy_desc: "면과 군 단위에서 인민위원회가 행정을 맡는다. 위에서 내려온 정부가 아니라 아래에서 올라온 정부이고, 그래서 무너뜨리려면 한 곳이 아니라 수백 곳을 무너뜨려야 한다."
 KPR_provisional_government: "정부 수립 선포"
 KPR_provisional_government_desc: "건국준비위원회가 정부를 세운다고 선언한다. 서두른 이유는 분명했다. 미군이 상륙하기 전에 반도에 이미 정부가 있어야 했기 때문이다. 역사에서는 사흘이 모자랐다."
 KPR_national_committees: "인민위원회 전국 조직"
 KPR_national_committees_desc: "1945년 8월이 끝나기 전에 전국에 백마흔 곳이 넘는 인민위원회가 섰다. 누가 지시해서가 아니라 동시에 일어났다. 이것이 조직력의 증거인지 공백의 증거인지는 보는 사람에 따라 달랐고, 미군정은 후자로 읽었다."
 KPR_equidistant_diplomacy: "미소 등거리 외교"
 KPR_equidistant_diplomacy_desc: "미국과 소련 어느 쪽에도 기울지 않는다. 두 나라가 반도를 반씩 나눠 들어와 있는 상황에서 이것은 외교 노선이 아니라 생존 조건이다. 그리고 두 나라 모두, 등거리에 선 상대를 상대편 사람으로 읽는다."
 KPR_anti_trusteeship_rally: "신탁 반대 국민대회"
 KPR_anti_trusteeship_rally_desc: "1945년 12월 모스크바 삼상회의가 최대 5년의 신탁통치를 결정한다. 반대 대회가 전국에서 열린다. 이 문제 하나로 좌우가 갈라졌고, 그 갈라짐은 다시 붙지 않았다."
 KPR_proclaim_republic: "조선인민공화국 선포"
 KPR_proclaim_republic_desc: "1945년 9월 6일, 경기고녀 강당에서 조선인민공화국이 선포된다. 주석은 이승만, 부주석은 여운형이었다. 이승만은 아직 미국에 있었고 수락한 적도 없었다. 미군정은 이 정부를 인정하지 않았고 그해 12월에 해산시켰다."
 KOR_ind_rice_plan: "산미증식계획 재개"
 KOR_ind_rice_plan_desc: "1920년에 시작해 1934년에 멈춘 계획이다. 멈춘 이유는 조선에 쌀이 남아서가 아니라 일본 농민이 값이 내려간다고 항의했기 때문이었다. 다시 여는 것은 논을 늘리는 일이고, 늘어난 쌀이 어디로 실려 가는지는 계획서에 적혀 있지 않다."
 KOR_ind_cotton_sheep: "남면북양"
 KOR_ind_cotton_sheep_desc: "우가키 총독이 반도를 둘로 갈라 남쪽은 목화, 북쪽은 양으로 정했다. 조선의 농업을 조선이 무엇을 먹을지가 아니라 일본의 방적공장이 무엇을 필요로 하는지에 맞춰 다시 짠 것이다. 원료는 실제로 늘어난다."
 KOR_ind_hungnam_nitrogen: "흥남 질소비료"
 KOR_ind_hungnam_nitrogen_desc: "노구치 시타가우가 1927년 흥남에 세운 조선질소비료는 당시 세계에서 손꼽히는 화학공장이었다. 값싼 전기와 값싼 노동이 한자리에 있었기 때문에 가능했고, 둘 다 조선의 것이었다."
 KOR_ind_supung_dam: "수풍댐 건설"
 KOR_ind_supung_dam_desc: "압록강을 막는다. 완공되면 아시아에서 가장 큰 발전소가 되고, 그 전기는 흥남으로, 그리고 만주로 간다. 물에 잠기는 마을의 수는 계획서의 항목이 아니다."
 KOR_ind_musan_iron: "무산 철광 개발"
 KOR_ind_musan_iron_desc: "함경북도 무산의 노천 광산은 매장량으로는 아시아 최대급이지만 품위가 낮아 캐낸 그대로는 쓸 수 없다. 선광 설비를 붙이면 광석이 쇳물이 되고, 쇳물은 대개 바다를 건넌다."
 KOR_ind_kyomipo_steel: "겸이포 제철소"
 KOR_ind_kyomipo_steel_desc: "미쓰비시가 1918년 대동강 하구에 세운 제철소다. 무산의 광석과 평안도의 석탄이 만나는 자리에 있어서, 반도 안에서 쇠를 돌에서 판까지 끝까지 만들 수 있는 몇 안 되는 곳이다."
 KOR_ind_aoji_synthetic: "아오지 인조석유"
 KOR_ind_aoji_synthetic_desc: "아오지의 갈탄을 기름으로 바꾼다. 석탄액화는 비싸고 효율이 낮지만, 제국에 유전이 없다는 사실은 값으로 흥정할 수 있는 것이 아니다. 반도에서 나는 기름은 전부 여기서 나온다."
 KOR_ind_heavy_industries: "조선중공업 설립"
 KOR_ind_heavy_industries_desc: "1937년 부산에 세워진 조선중공업은 반도 최초의 근대적 조선소다. 지금 만들 수 있는 것은 화물선과 소형 함정뿐이지만, 배를 만들 줄 아는 손은 그 다음에 무엇이든 만든다."
 KOR_ind_kyungsung_textile: "경성방직과 화신"
 KOR_ind_kyungsung_textile_desc: "김성수의 경성방직과 박흥식의 화신. 조선인이 조선인의 자본으로 세운 공장과 백화점이고, 그 자본이 총독부의 허가 없이는 한 걸음도 움직이지 못했다는 것도 똑같이 사실이다. 민족자본이라는 말이 가장 무거워지는 자리다."
 KOR_ind_regional_specialization: "지역 특화"
 KOR_ind_regional_specialization_desc: "반도의 산업을 한 장의 지도 위에 놓고 본다. 어디에 무엇이 있는지를 적는 일이 아니라 어디에 무엇을 두기로 하는지를 정하는 일이고, 빠뜨린 자리는 비어 있는 채로 남는다."
 KOR_ind_five_year_plan: "조선 산업 5개년 계획"
 KOR_ind_five_year_plan_desc: "총독부가 반도를 5년 단위로 계획하기 시작한다. 계획이라는 말이 붙는 순간 숫자는 목표가 되고, 목표는 결국 누군가가 채운다."
 KOR_ind_gyeongin_belt: "경인 공업지대 정비"
 KOR_ind_gyeongin_belt_desc: "경성과 인천 사이 좁은 회랑에 반도의 공장이 몰려 있다. 항구와 수도와 철도가 한 시간 거리 안에 다 들어 있기 때문이고, 그래서 여기가 무너지면 다른 어느 곳도 대신하지 못한다."
 KOR_ind_railway_double: "철도 복선화"
 KOR_ind_railway_double_desc: "경부선과 경의선을 복선으로 만든다. 부산에서 신의주까지가 한 줄이 아니라 두 줄이 되면 반도는 섬과 대륙 사이의 다리가 된다. 다리는 건너는 쪽이 쓰는 것이다."
 KOR_ind_keijo_university: "경성제대 이공학부"
 KOR_ind_keijo_university_desc: "경성제국대학은 1924년에 열렸지만 법문학부와 의학부뿐이었다. 조선인에게 공학을 가르치지 않은 것은 예산 문제가 아니었다. 이공학부를 여는 일은 그 판단을 뒤집는 것이다."
 KOR_ind_korea_in_world: "세계 속의 조선"
 KOR_ind_korea_in_world_desc: "반도가 만든 것이 남의 이름을 거쳐 나가지 않고 제 이름으로 나가기 시작한다. 종주국의 몫은 산업으로 밀어낼 수 있는 가장 낮은 데까지 내려가고, 0이 되지는 않는다. 마지막 몫은 산업으로 끝낼 수 있는 문제가 아니다."
 KOR_officer_census: "장교 인력 조사"
 KOR_officer_census_desc: "누가 부대를 지휘할 수 있는지 센다. 조선인 장교는 두 갈래로만 존재했다. 일본 육사를 나온 사람들과 만주와 중국의 무관학교를 나온 사람들. 두 명부는 서로를 적으로 알고 있었고, 그래도 합치면 한 군대의 뼈대가 된다."
 KOR_army_hq_accord: "조선군사령부와의 협정"
 KOR_army_hq_accord_desc: "조선군사령부는 반도에 주둔한 일본군의 사령부이고, 조선인이 부대를 편성하는 일을 끝까지 승인하지 않은 쪽이다. 협정을 맺는다는 것은 그 승인을 받아 낸다는 뜻이고, 받아 내는 값이 무엇인지는 협정문에 적힌다."
 KOR_japanese_trained_officers: "일본군 출신 장교 등용"
 KOR_japanese_trained_officers_desc: "이응준, 김석원, 홍사익. 일본 육사를 나와 일본군에서 복무한 조선인들이다. 훈련은 반도에서 가장 좋았고 경력은 가장 무거웠다. 홍사익은 전후에 포로 학대로 처형됐다. 쓸 수 있는 사람과 써도 되는 사람은 같은 명부가 아니다."
 KOR_standing_divisions: "현역 사단 편성"
 KOR_standing_divisions_desc: "상비군을 만든다. 유격대는 사람이 모이면 생기지만 사단은 병영과 급여와 보급창이 있어야 생긴다. 나라가 군대를 갖는다는 말은 대개 이 세 가지를 갖는다는 뜻이다."
 KOR_artillery_logistics: "포병·병참 정비"
 KOR_artillery_logistics_desc: "유격대가 정규군이 되지 못하는 지점은 대개 포와 보급이다. 소총은 빼앗을 수 있지만 포탄은 매일 와야 하고, 매일 오게 만드는 일은 용기가 아니라 회계의 문제다."
 KOR_sinheung_academy: "신흥무관학교 재건"
 KOR_sinheung_academy_desc: "1911년 서간도에 세워져 1920년까지 삼천 명이 넘는 졸업생을 낸 학교다. 이회영 형제가 재산을 모두 팔아 세웠고, 청산리에서 싸운 지휘관 다수가 이 학교를 거쳤다. 다시 세우는 일은 건물이 아니라 그 명부를 잇는 일이다."
 KOR_guerrilla_doctrine: "유격전 교리 확립"
 KOR_guerrilla_doctrine_desc: "만주에서 이십 년 동안 몸으로 배운 것을 문서로 만든다. 교리가 되면 겪지 않은 사람도 쓸 수 있고, 겪은 사람이 죽어도 남는다. 유격전에서 가장 자주 사라지는 것은 사람이 아니라 방법이었다."
 KOR_uiyeoldan_legacy: "의열단의 유산"
 KOR_uiyeoldan_legacy_desc: "1919년 김원봉이 만든 의열단은 폭탄과 권총으로 총독부와 경찰서를 쳤다. 신채호가 써 준 조선혁명선언은 민중의 직접 폭력을 독립의 유일한 길로 적었다. 남은 것은 조직이 아니라 방법이고, 방법은 상속된다."
 KOR_manchurian_bases: "만주 국경 유격 거점"
 KOR_manchurian_bases_desc: "압록강과 두만강 건너에 근거지를 둔다. 국경은 막는 선이 아니라 건너다니는 선이었고, 한쪽에서 쫓기면 다른 쪽으로 넘어갈 수 있다는 사실 하나가 이십 년 동안 무장투쟁을 지탱했다."
 KOR_military_academy: "사관학교 설립"
 KOR_military_academy_desc: "장교를 남의 나라 학교에 보내지 않고 직접 기른다. 이것이 서면 군대의 인적 구성이 처음으로 이 나라의 결정이 된다. 그래도 첫 기수가 대위가 되기까지는 몇 해가 걸리고, 그 몇 해는 건너뛸 수 없다."
 KOR_navy_ports: "진남포·원산 항만 정비"
 KOR_navy_ports_desc: "진남포는 서해, 원산은 동해. 반도는 삼면이 바다이면서 두 바다가 서로 통하지 않는다. 남쪽 끝을 돌아야 한다. 항구를 양쪽에 두는 것은 선택이 아니라 지형이 시키는 일이다."
 KOR_navy_shipyard: "조선중공업 확장"
 KOR_navy_shipyard_desc: "부산의 조선소를 늘린다. 화물선을 만들던 선대에서 군함을 만들려면 설비보다 도면과 사람이 더 오래 걸린다. 배를 만드는 일은 산업이기 전에 축적이다."
 KOR_coastal_flotilla: "연안 방어 전대"
 KOR_coastal_flotilla_desc: "반도의 해안선은 길고 섬이 많다. 큰 배로 지킬 수 있는 바다가 아니라 작은 배로 지켜야 하는 바다다. 연안 방어는 이길 수 없는 상대를 앞에 두고도 성립하는 몇 안 되는 해군 전략이다."
 KOR_submarine_priority: "잠수함 우선주의"
 KOR_submarine_priority_desc: "주력함으로는 일본 해군을 이길 수 없다. 이길 수 없을 때 남는 것은 상대가 지켜야 하는 것을 치는 일이고, 일본이 지켜야 하는 것은 함대가 아니라 항로였다."
 KOR_abandon_capitals: "주력함 포기"
 KOR_abandon_capitals_desc: "주력함을 만들지 않기로 정한다. 전함 한 척 값이면 구축함 여러 척과 잠수함 여러 척이 나오고, 반도가 싸울 바다에서는 뒤쪽이 더 오래 살아남는다. 포기라고 부르지만 실제로는 계산이다."
 KOR_air_no_baek_rin: "노백린의 유산"
 KOR_air_no_baek_rin_desc: "노백린은 1920년 캘리포니아 윌로우스에 한인비행학교를 세웠다. 자금은 쌀농사로 돈을 번 김종림이 댔고 비행기는 여섯 대였다. 나라도 공군도 없던 시기에 조종사부터 길렀다는 사실이 이 계열의 출발점이다."
 KOR_air_kwon_ki_ok: "권기옥과 중국 항공대"
 KOR_air_kwon_ki_ok_desc: "권기옥은 1925년 윈난 항공학교를 나와 중국 공군에서 십 년 넘게 비행했다. 조선 최초의 여성 비행사이고, 조선인 조종사 대부분이 그랬듯 남의 나라 군복을 입고 비행 시간을 쌓았다."
 KOR_air_volunteers: "국제 의용 비행대"
 KOR_air_volunteers_desc: "외국인 조종사를 부른다. 비행기는 사 올 수 있고 활주로는 닦을 수 있지만 조종사는 몇 해가 걸린다. 그 몇 해를 돈으로 사는 방법이 이것이고, 값은 돈과 그 사람들이 떠난 뒤에 남는 공백이다."
 KOR_air_pyongyang_field: "평양 비행장 확장"
 KOR_air_pyongyang_field_desc: "평양 비행장을 넓힌다. 반도에서 만주와 화북에 가장 가까운 큰 비행장이다. 여기서 뜨는 비행기가 국경 너머에 닿는다는 뜻이면서, 국경 너머에서 오는 비행기가 여기 먼저 닿는다는 뜻이기도 하다."
 KOR_seize_the_moment: "기회를 잡다"
 KOR_seize_the_moment_desc: "일본이 무너지는 순간이 온다. 그때까지 어느 편에 서 있었는지가 갑자기 되돌릴 수 있는 것이 되고, 실제로 많은 사람이 되돌렸다. 이 중점은 그 며칠 동안 반도에서 일어난 일을 하나의 선택으로 만든 것이다."
 KOR_disarm_governorate: "총독부 무장해제"
 KOR_disarm_governorate_desc: "총독부의 무기고와 경찰을 접수한다. 아베 총독은 1945년 8월에 여운형에게 치안 유지를 부탁했지만 무기까지 넘긴 것은 아니었다. 무장해제란 넘겨받는 일이 아니라 가서 가져오는 일이다."
 KOR_assume_administration: "행정권 접수"
 KOR_assume_administration_desc: "면사무소와 세무서와 우편국이 계속 돌아가게 만든다. 혁명의 다음 날 필요한 것은 구호가 아니라 호적과 배급표를 다룰 줄 아는 사람들이고, 그 사람들은 대개 어제까지 총독부에서 일하던 사람들이다."
 KOR_declare_government: "정부 수립 선포"
 KOR_declare_government_desc: "정부가 있다고 선언한다. 선언은 즉시 효력을 갖지만 그 효력은 안에서만 유효하다. 밖에서 인정하는지는 별개의 문제이고, 별개의 문제가 대개 더 오래 걸린다."
 KOR_self_defense_corps: "자위대 조직"
 KOR_self_defense_corps_desc: "마을마다 무장한 사람들을 세운다. 훈련도 장비도 없지만 숫자가 많고, 무엇보다 자기 마을에 있다. 정규군이 닿지 않는 곳에서 질서를 지키는 것도 무너뜨리는 것도 이런 조직이다."
 KOR_committee_autonomy: "인민위원회 자치"
 KOR_committee_autonomy_desc: "점령군이 들어와도 인민위원회는 해산하지 않는다. 명령을 받는 기관이 아니라 이미 그 자리에 있던 기관이기 때문이고, 점령군이 상대해야 하는 것이 개인이 아니라 조직이 된다."
 KOR_anti_trusteeship_movement: "신탁통치 반대 운동"
 KOR_anti_trusteeship_movement_desc: "1945년 12월의 신탁통치 결정에 반대한다. 처음에는 좌우 모두 반대했고 며칠 뒤 좌익이 찬성으로 돌아서면서 반탁과 찬탁이 좌와 우의 다른 이름이 된다. 반도가 갈라진 자리를 하나만 짚으라면 대개 여기를 짚는다."
 KOR_separate_government: "단독정부 수립"
 KOR_separate_government_desc: "반도의 절반으로 정부를 세운다. 1948년에 실제로 일어난 일이고, 세운 쪽은 통일을 포기한 것이 아니라 미룬 것이라고 말했다. 미룬 것은 이 년 뒤에 전쟁으로 돌아왔다."
 KOR_infiltrate_hq: "사령부 내부 포섭"
 KOR_infiltrate_hq_desc: "조선군사령부 안에 사람을 심는다. 조선인 장교와 통역과 서기가 그 건물 안에 실제로 있었고, 그들이 무엇을 보고 무엇을 들고 나왔는지는 대개 기록이 남지 않았다. 남지 않는 것이 이 일의 조건이다."
 KOR_prepare_arsenals: "무기고 접수 준비"
 KOR_prepare_arsenals_desc: "봉기의 성패는 첫날 아침까지 총이 몇 자루 손에 들어오는가로 갈린다. 어느 창고에 무엇이 있고 열쇠를 누가 갖고 있는지를 미리 적어 둔다. 발각되면 그 명단이 그대로 검거 명단이 된다."
 KOR_keijo_uprising: "경성 봉기"
 KOR_keijo_uprising_desc: "경성에서 봉기한다. 반도에 주둔한 일본군 두 개 사단이 아직 온전한 상태에서 시작하는 일이고, 성공의 조건은 그들이 명령을 받기 전에 사령부가 사라지는 것이다. 1919년에 없었던 것은 용기가 아니라 무기였다."
