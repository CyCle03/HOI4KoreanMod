 KOR_ind_rice_plan: "Resume the Rice Production Plan"
 KOR_ind_rice_plan_desc: "Begun in 1920 and stopped in 1934 - stopped not because Korea had rice to spare but because farmers in Japan complained the price was falling. Reopening it means more paddy. Where the extra rice is shipped is not written into the plan."
 KOR_ind_cotton_sheep: "Cotton in the South, Sheep in the North"
 KOR_ind_cotton_sheep_desc: "Governor-General Ugaki cut the peninsula in two and assigned cotton to the south and sheep to the north: Korean agriculture rearranged around what the mills in Japan needed rather than around what Korea ate. The raw material does arrive."
 KOR_ind_hungnam_nitrogen: "Hungnam Nitrogenous Fertilizer"
 KOR_ind_hungnam_nitrogen_desc: "Noguchi Shitagau's Chosen Nitrogenous Fertilizer works, raised at Hungnam in 1927, was among the largest chemical plants anywhere in the world. It was possible because cheap power and cheap labour sat in the same place, and both of them were Korean."
 KOR_ind_supung_dam: "Build the Supung Dam"
 KOR_ind_supung_dam_desc: "A wall across the Yalu. Finished, it is the largest power station in Asia, and the current runs to Hungnam and on into Manchuria. The number of villages that go under water is not a line in the plan."
 KOR_ind_musan_iron: "Develop the Musan Iron Mine"
 KOR_ind_musan_iron_desc: "The open pit at Musan holds one of the largest iron reserves in Asia and ore too poor to use as it comes out of the ground. Add the concentrators and the ore becomes steel, and the steel usually crosses the water."
 KOR_ind_kyomipo_steel: "The Kyomipo Steelworks"
 KOR_ind_kyomipo_steel_desc: "Mitsubishi's works at the mouth of the Taedong, opened in 1918. It stands where Musan's ore meets Pyongan's coal, one of the few places on the peninsula that can take iron the whole way from rock to plate."
 KOR_ind_aoji_synthetic: "Aoji Synthetic Oil"
 KOR_ind_aoji_synthetic_desc: "Turning Aoji's brown coal into oil. Liquefaction is expensive and inefficient, and the empire having no oilfields is not a fact that negotiates on price. What petroleum the peninsula produces, it produces here."
 KOR_ind_heavy_industries: "Found Chosen Heavy Industries"
 KOR_ind_heavy_industries_desc: "Chosen Heavy Industries, raised at Busan in 1937, is the peninsula's first modern shipyard. What it can build today is freighters and small craft. Hands that have built a ship go on to build other things."
 KOR_ind_kyungsung_textile: "Kyungsung Spinning and Hwashin"
 KOR_ind_kyungsung_textile_desc: "Kim Seong-su's spinning mill and Park Heung-sik's department store: Korean factories built with Korean money, and Korean money that could not move a step without the Government-General's permission. This is where the phrase national capital weighs the most."
 KOR_ind_regional_specialization: "Regional Specialization"
 KOR_ind_regional_specialization_desc: "The peninsula's industry laid out as a single map. Not a record of what is where but a decision about what goes where, and the places left out of it simply stay empty."
 KOR_ind_five_year_plan: "The Chosen Five-Year Plan"
 KOR_ind_five_year_plan_desc: "The Government-General begins planning the peninsula in five-year blocks. The moment the word plan is attached the numbers become targets, and targets are met by somebody."
 KOR_ind_gyeongin_belt: "The Gyeongin Industrial Belt"
 KOR_ind_gyeongin_belt_desc: "The peninsula's factories crowd the narrow corridor between Keijo and Chemulpo, because the port and the capital and the railway all sit within an hour of one another. Which also means that nowhere else can take over if it goes."
 KOR_ind_railway_double: "Double-Track the Railways"
 KOR_ind_railway_double_desc: "Two tracks where there was one, from Busan to Sinuiju. Doubled, the peninsula stops being a place and becomes the bridge between the islands and the mainland. A bridge is used by whoever is crossing it."
 KOR_ind_keijo_university: "Keijo University School of Science"
 KOR_ind_keijo_university_desc: "Keijo Imperial University opened in 1924 with faculties of law and medicine and nothing else. That Koreans were not taught engineering was not a budget decision. Opening the science faculty reverses it."
 KOR_ind_korea_in_world: "Korea in the World"
 KOR_ind_korea_in_world_desc: "What the peninsula makes begins leaving under its own name instead of passing through somebody else's. The overlord's cut falls as low as industry can push it, and it does not reach zero. The last of it is not an industrial problem."
