l_english:

 KOR_resource_survey: "Survey Korea's Resources"
 KOR_resource_survey_desc: "The Government-General counts what is under the peninsula, from the beginning. What the geological survey produced was not a map but an inventory: what lies where, how much of it, and what it costs to bring up. The Government-General learns what Korea has before Korea does."
 KOR_logistics_base: "The Logistics Base"
 KOR_logistics_base_desc: "Governor-General Minami's name for the peninsula. Korea is a colony and the rear of a front at the same time, and what a rear area produces does not stay in the rear area. The factories do multiply. Whose they are is a separate question."
 KOR_underground_network: "The Underground Network"
 KOR_underground_network_desc: "The arrests of the 1930s did not end the organisations. They pushed them underground. What is left is a chain of people with no name and no programme, each knowing the next one and no further. Slow, narrow, and hard to pull apart."
 CHO_national_mobilization: "Spiritual Mobilization"
 CHO_national_mobilization_desc: "In 1938 the Government-General raises the Federation for Total Spiritual Mobilisation. Patriotic units of ten households cover the peninsula, and each morning brings the bow toward the palace and the oath. What is being mobilised is not material. It is the shape of every day."
 CHO_imperial_subject_oath: "Oath of Imperial Subjects"
 CHO_imperial_subject_oath_desc: "From 1937 it is recited aloud every day in schools and offices and factories. Three lines, with one version for children and another for adults. The point is not that anyone believes it. The point is that everyone says it, daily."
 CHO_education_ordinance: "Revised Education Ordinance"
 CHO_education_ordinance_desc: "The Third Education Ordinance. Korean falls from required subject to elective. The same revision removes the distinction between Korean and Japanese schools from their names - the way the discrimination was abolished was by abolishing Korean."
 CHO_name_change_order: "The Name-Change Order"
 CHO_name_change_order_desc: "Six months from February 1940. Korean surnames replaced by Japanese house-names. The ordinance said voluntary; without it a child could not enrol and a family could not draw rations. Even so, about one household in eight never changed."
 CHO_korean_bureaucrats: "Korean Officials in Office"
 CHO_korean_bureaucrats_desc: "More Korean seats inside the Government-General. Koreans did reach provincial governor, and no further. The whole of this policy lives in the distance between giving a man a post and giving him authority."
 CHO_army_volunteer_ordinance: "Army Special Volunteer Ordinance"
 CHO_army_volunteer_ordinance_desc: "From 1938 a Korean may volunteer for the Imperial Army. Applications ran to many times the quota every year. The Government-General read that number as proof of loyalty; most of the men applying had no other work."
 CHO_labor_mobilization: "National Labour Requisition"
 CHO_labor_mobilization_desc: "The National Requisition Ordinance of 1939 reaches Korea. The name changed three times - recruitment, then official mediation, then requisition - and the only thing that actually changed was whether a man could refuse. They went to the coal pits of Kyushu, and to Sakhalin."
 CHO_navy_volunteers: "Navy Special Volunteers"
 CHO_navy_volunteers_desc: "In 1943 the navy follows the army in taking Koreans. The threshold fell as the war worsened - not because the empire had come to trust Koreans but because there was nowhere else left to find men."
 CHO_conscription_act: "Conscription Enacted"
 CHO_conscription_act_desc: "In 1944 volunteering becomes conscription. The Government-General had put this off for thirty years, because arming a colony is the one thing a colonial government cannot take back. It has run out of ways not to."
 CHO_diet_election_law: "Diet Election Law"
 CHO_diet_election_law_desc: "April 1945: seats in the Imperial Diet for Korea. Twenty-three of them for twenty-five million people, and the vote restricted to men paying above a set amount of tax. The empire ended before the election was ever held."
 CHO_autonomous_assembly: "The Chosen Assembly"
 CHO_autonomous_assembly_desc: "The last thing the Government-General has left to offer. An assembly is raised, and it sits under the Governor-General's veto, and the Governor-General is appointed from Tokyo. That this government does not outlive the empire is already settled here."
 KOR_national_front_league: "Korean National Front League"
 KOR_national_front_league_desc: "At Nanjing in 1937 Kim Won-bong binds the left-wing groups into one front. It is a separate alliance from the one around the Provisional Government, and that there were two of them is itself the state of the independence movement in these years."
 KOR_volunteer_corps: "The Volunteer Corps"
 KOR_volunteer_corps_desc: "Raised at Hankou on 10 October 1938, the Volunteer Corps is the first regular Korean armed formation on Chinese soil. The Nationalist government paid for it, which is why it could fight only where that government said. Within a few years most of its men walked north."
 KOR_left_right_negotiation: "Left-Right Negotiations"
 KOR_left_right_negotiation_desc: "Chongqing and Yan'an sit down in the same room. Having the same enemy turns out not to produce the same country, and this is where that gets established. Choose one and the other does not open again."
 KPG_unify_kip: "Unify the Independence Party"
 KPG_unify_kip_desc: "At Chongqing in 1940 the Korean National Party, the Korean Independence Party and the Korean Revolutionary Party fold into one. Kim Ku leads the result, and for the first time in twenty years the Provisional Government has a party underneath it."
 KPG_samgyun: "Proclaim the Three Equalities"
 KPG_samgyun_desc: "Cho So-ang's Three Equalities: of politics, of economy, of education. It becomes the frame of the 1941 programme for nation-building - a government with no country writing down that country's land law and school system in advance."
 KPG_western_commission: "The Washington Commission"
 KPG_western_commission_desc: "The Commission to America and Europe, opened in Washington in 1919 and run by Syngman Rhee. Its work was explaining Korea to American politics. It achieved almost nothing, and twenty-five years later it was the only Korean organisation with anyone it could telephone in Washington."
 KPG_restoration_army: "Found the Restoration Army"
 KPG_restoration_army_desc: "The Korean Restoration Army is founded at Chongqing on 17 September 1940, with Ji Cheong-cheon commanding. It began with something like thirty men, and those thirty men made it a fact that the government had an army."
 KPG_kmt_agreement: "Agreement with the Nationalists"
 KPG_kmt_agreement_desc: "The Nationalist government funds the Restoration Army and asks for nine articles in return. The army takes its orders from the Chinese military commission, and the Chinese decide where it operates. Whose an army is, when somebody else pays for it, is written out here."
 KPG_recognition_diplomacy: "The Recognition Campaign"
 KPG_recognition_diplomacy_desc: "The campaign to be recognised as a government. China recognised it in practice and never on paper; the United States declined on the grounds that there was more than one Korean exile body. Recognition is not won. It is given by somebody else."
 KPG_indian_mission: "The Indian Theatre Detachment"
 KPG_indian_mission_desc: "In 1943 nine men of the Restoration Army go with the British to the Indian and Burmese front. The work was translating Japanese documents, questioning prisoners, and broadcasting. Nine men - and a record that Koreans stood on an Allied front."
 KPG_american_koreans: "Mobilize the American Koreans"
 KPG_american_koreans_desc: "The Koreans of Hawaii and California were the Provisional Government's money. A government in Chongqing kept going on what men in the cane fields and the orchards sent back. They had organisation and they had votes, and in American politics a vote moves faster than a document."
 KPG_allied_recognition: "Win Allied Recognition"
 KPG_allied_recognition_desc: "The moment Korea is written into an Allied document as a government. In history it never came. The Cairo Declaration set down Korea's independence and left out the date, and a promise with no date is one the promiser can reread whenever it suits."
 KPG_eagle_project: "The Eagle Project"
 KPG_eagle_project_desc: "In 1945 the American OSS and the Restoration Army prepare to go in. The training was at Xi'an, and Japan surrendered days before the first team left. Kim Ku wrote that the news did not make him glad, because they had not gone in by their own hand."
 KIL_found_league: "Found the Independence League"
 KIL_found_league_desc: "In July 1942, in the Taihang mountains, the North China Korean Independence League is founded, with Kim Tu-bong as its chairman. It inherits the Youth Federation that came before it, and from here there is a separate Korean political body living inside the Chinese Communist base areas."
 KIL_move_to_yanan: "March to Yan'an"
 KIL_move_to_yanan_desc: "Leaving Nationalist territory and crossing to the Eighth Route Army. Most of the Volunteer Corps took this road, and the reason was simpler than ideology: in the south the chance to fight the Japanese never came."
 KIL_youth_school: "North China Youth School"
 KIL_youth_school_desc: "A school in the Taihang range to make Korean cadres. What it taught was not only soldiering but political theory, the Korean language, and how to organise. The men who learned here would run a good deal of the northern administration after liberation."
 KIL_volunteer_army: "Raise the Volunteer Army"
 KIL_volunteer_army_desc: "The Volunteer Corps' North China detachment is re-formed as the Korean Volunteer Army under Mu Jeong. It sits inside the Eighth Route Army's structure and stays a Korean formation, and what it is aimed at is not North China but the far side of the Yalu."
 KIL_taihang_base: "The Taihang Base Area"
 KIL_taihang_base_desc: "The Taihang mountains are hard country to sweep and they look down on the North China plain. At Hujiazhuang in 1941 four men of the Volunteer Corps were killed. A base area is not a safe place; it is a place with somewhere to fall back to."
 KIL_join_nauaa: "Join the Anti-Japanese United Army"
 KIL_join_nauaa_desc: "Joining the Northeast Anti-Japanese United Army in Manchuria. Koreans and Chinese were mixed in the same units and so were the commanders. The 6th Division, under Kim Il-sung, was one of them."
 KIL_pochonbo_raid: "The Pochonbo Raid"
 KIL_pochonbo_raid_desc: "On the night of 4 June 1937 the border is crossed and the police post and township office at Pochonbo are shot up. Militarily it came to little, and the Dong-a Ilbo ran a special edition. Appearing in a newspaper inside the country - that was what the raid actually achieved."
 KIL_88th_brigade: "88th Separate Rifle Brigade"
 KIL_88th_brigade_desc: "In 1942 what was left of the United Army, pushed out of Manchuria, gathers in the Soviet Far East as the 88th Separate Rifle Brigade. Soviet establishment, Soviet rank badges. Liberation, in the end, arrived in the shape of this brigade coming in behind the Red Army."
 KIL_homeland_raiders: "Raiders into the Homeland"
 KIL_homeland_raiders_desc: "Units formed to cross the Yalu and the Tumen and go in. Fighting in China and fighting in Korea are different undertakings; in the second there is nowhere to fall back to even when you win."
 KIL_faction_unity: "Unite the Two Factions"
 KIL_faction_unity_desc: "The men who came from Yan'an and the men who came from Manchuria. The same ideology, a different war, and a different country paying for it. Putting the two together took fifteen years in the north after liberation, and it did not end in unity."
 KIL_land_reform: "Land Reform"
 KIL_land_reform_desc: "The landlords' fields taken and handed to the people working them. Most of the peninsula's population were tenants, so this decides who is on whose side before it is an economic policy at all. It is the hardest kind of reform to undo."
 YIH_dissolve_office: "Dissolve the Yi Household Office"
 YIH_dissolve_office_desc: "The Yi Royal Household Office was named as the bureau that looked after the imperial house. What it actually did was dismantle the palace administration and file the royal family in among the Japanese peerage. Taking the sign down is not a declaration that the house is restored. It removes the hand that was managing it, and nobody has yet said what stands there instead."
 YIH_return_of_royals: "Return of the Royal House"
 YIH_return_of_royals_desc: "Which of them comes home. Yi Un was raised in Tokyo, is a lieutenant general of the Imperial Japanese Army, and married into the Japanese imperial family. Yi Kang tried to slip away to Shanghai in 1919 and was taken at Andong. Both are Gojong's sons, and two different countries come out of the same house."
 YIH_gwangmu_era: "Restore the Gwangmu Era"
 YIH_gwangmu_era_desc: "Gwangmu is the era name Gojong took in 1897 when he called himself emperor. Restoring an era name changes the calendar, and changing the calendar decides which year you start counting from. The count begins again as though 1910 had not happened."
 YIH_reclaim_estates: "Reclaim the Royal Estates"
 YIH_reclaim_estates_desc: "The palace lands, the tombs and the property the Household Office administered, taken back. For thirty years that property belonged to the royal house and could not have a single plot of it sold without the Government-General's approval. Owning and disposing come back into one hand."
 YIH_jongmyo_rites: "Restore the Jongmyo Rites"
 YIH_jongmyo_rites_desc: "The rites at Jongmyo never stopped under colonial rule, but they were cut down in scale and shortened in procedure. Performing them whole again is not a religious occasion. It is a claim to legitimacy - the claim that this dynasty has not ended."
 YIH_gubon_sincham: "Old Foundation, New Learning"
 YIH_gubon_sincham_desc: "Take the old as the foundation and the new for reference. It was the slogan of the Gwangmu Reforms, and it meant importing Western institutions without touching the throne. It is the most courteous name anyone has found for half a modernisation."
 YIH_reproclaim_empire: "Re-proclaim the Great Korean Empire"
 YIH_reproclaim_empire_desc: "The Great Korean Constitution of 1899, proclaimed again. Its second article set down that the politics of the empire were an autocracy unchanging for ten thousand generations. What is being restored here is not a country. It is that sentence."
 YIH_marshal_office: "Rebuild the Marshal's Office"
 YIH_marshal_office_desc: "The Marshal's Office Gojong raised in 1899 existed so that the emperor could command the army himself. It means not going through the cabinet, and it means the army belongs to the palace rather than to the government."
 YIH_german_advisors: "Invite a German Military Mission"
 YIH_german_advisors_desc: "Building an army requires someone to teach it. The Korean Empire took Russian instructors and then Japanese ones, and each time the instructors came the sending country's influence came with them. Calling in the Germans is that calculation run once more."
 YIH_imperial_guard: "Raise the Imperial Guard"
 YIH_imperial_guard_desc: "The Royal Guard was the unit that resisted longest when the army was disbanded in 1907. Pak Seung-hwan shot himself at the Great South Gate and his soldiers picked up their rifles. Raising the guard again picks up what was cut off at that spot."
 YIH_perpetual_neutrality: "Declare Perpetual Neutrality"
 YIH_perpetual_neutrality_desc: "In 1904 the Korean Empire declared itself neutral. Russia and Japan both read the declaration and disregarded it. Neutrality is not something you declare into being; it is something others have to observe, and manufacturing a reason for them to observe it is what this declaration actually has to do."
 KPR_founding_league: "The Nation-Building League"
 KPR_founding_league_desc: "In August 1944 Yo Un-hyong forms the League for National Foundation. Its programme was never put on paper and it kept no membership roll. The Government-General's police never established what it actually was, and when liberation came it was the only organisation inside the peninsula that could move at once."
 KPR_peasant_unions: "Rebuild the Peasant Unions"
 KPR_peasant_unions_desc: "The revolutionary peasant unions of the 1930s were broken by arrests, but the people stayed in the villages. Rebuilding them is not founding a new organisation. It is putting a name back on people who already know one another."
 KPR_labor_council: "National Council of Trade Unions"
 KPR_labor_council_desc: "The unions of the factories and the docks tied together nationally. Most Korean workers worked in Japanese-owned plants, so from the moment a union exists it is a national question as much as a labour one."
 KPR_coalition_line: "The Left-Right Coalition Line"
 KPR_coalition_line_desc: "The judgement that neither side can represent the whole peninsula alone. Yo Un-hyong and Kim Kyu-sik actually walked this road, and both were called traitors within their own camps. Standing in the middle means being hit from both sides."
 KPR_security_corps: "Organize the Constabulary"
 KPR_security_corps_desc: "Where the Government-General's police let go, the constabulary steps in. Badly armed and untrained, and for some weeks that summer they were what actually kept order on the peninsula. Power does not arrive by proclamation. It arrives by doing the thing nobody else is doing."
 KPR_local_autonomy: "Widen Local Autonomy"
 KPR_local_autonomy_desc: "People's committees take over administration at township and county level. Not a government sent down from above but one that came up from below, which means that pulling it down means pulling down not one place but several hundred."
 KPR_provisional_government: "Proclaim a Provisional Government"
 KPR_provisional_government_desc: "The Committee for the Preparation of Korean Independence declares that it is forming a government. The haste had a clear reason: there had to be a government on the peninsula before the Americans landed. In history it was three days short."
 KPR_national_committees: "People's Committees Nationwide"
 KPR_national_committees_desc: "Before August 1945 was out, more than a hundred and forty people's committees had formed across the country. Nobody ordered it; it happened at once, everywhere. Whether that is evidence of organisation or evidence of a vacuum depended on who was looking, and the American military government read it the second way."
 KPR_equidistant_diplomacy: "Equidistance Between Washington and Moscow"
 KPR_equidistant_diplomacy_desc: "Leaning toward neither Washington nor Moscow. With both of them standing on half the peninsula each, this is not a diplomatic line but a condition of survival. And both of them read anyone standing equidistant as belonging to the other one."
 KPR_anti_trusteeship_rally: "The Anti-Trusteeship Rally"
 KPR_anti_trusteeship_rally_desc: "In December 1945 the Moscow conference settles on a trusteeship of up to five years. Rallies against it are held across the country. The left and the right split over this single question, and the split never closed."
 KPR_proclaim_republic: "Proclaim the People's Republic"
 KPR_proclaim_republic_desc: "On 6 September 1945, in a school hall in Seoul, the People's Republic of Korea is proclaimed. Syngman Rhee was named chairman and Yo Un-hyong vice-chairman; Rhee was still in America and had never agreed to it. The American military government refused to recognise the republic and dissolved it in December."
 KOR_ind_rice_plan: "Resume the Rice Production Plan"
 KOR_ind_rice_plan_desc: "Begun in 1920 and stopped in 1934 - stopped not because Korea had rice to spare but because farmers in Japan complained the price was falling. Reopening it means more paddy. Where the extra rice is shipped is not written into the plan."
 KOR_ind_cotton_sheep: "Cotton in the South, Sheep in the North"
 KOR_ind_cotton_sheep_desc: "Governor-General Ugaki cut the peninsula in two and assigned cotton to the south and sheep to the north: Korean agriculture rearranged around what the mills in Japan needed rather than around what Korea ate. The raw material does arrive."
 KOR_ind_hungnam_nitrogen: "Hungnam Nitrogenous Fertilizer"
 KOR_ind_hungnam_nitrogen_desc: "Noguchi Shitagau's Chosen Nitrogenous Fertilizer works, raised at Hungnam in 1927, was among the largest chemical plants anywhere in the world. It was possible because cheap power and cheap labour sat in the same place, and both of them were Korean."
 KOR_ind_supung_dam: "Build the Supung Dam"
 KOR_ind_supung_dam_desc: "A wall across the Yalu. Finished, it is the largest power station in Asia, and the current runs to Hungnam and on into Manchuria. The number of villages that go under water is not a line in the plan."
 KOR_ind_musan_iron: "Develop the Musan Iron Mine"
 KOR_ind_musan_iron_desc: "The open pit at Musan holds one of the largest iron reserves in Asia and ore too poor to use as it comes out of the ground. Add the concentrators and the ore becomes steel, and the steel usually crosses the water."
 KOR_ind_kyomipo_steel: "The Kyomipo Steelworks"
 KOR_ind_kyomipo_steel_desc: "Mitsubishi's works at the mouth of the Taedong, opened in 1918. It stands where Musan's ore meets Pyongan's coal, one of the few places on the peninsula that can take iron the whole way from rock to plate."
 KOR_ind_aoji_synthetic: "Aoji Synthetic Oil"
 KOR_ind_aoji_synthetic_desc: "Turning Aoji's brown coal into oil. Liquefaction is expensive and inefficient, and the empire having no oilfields is not a fact that negotiates on price. What petroleum the peninsula produces, it produces here."
 KOR_ind_heavy_industries: "Found Chosen Heavy Industries"
 KOR_ind_heavy_industries_desc: "Chosen Heavy Industries, raised at Busan in 1937, is the peninsula's first modern shipyard. What it can build today is freighters and small craft. Hands that have built a ship go on to build other things."
 KOR_ind_kyungsung_textile: "Kyungsung Spinning and Hwashin"
 KOR_ind_kyungsung_textile_desc: "Kim Seong-su's spinning mill and Park Heung-sik's department store: Korean factories built with Korean money, and Korean money that could not move a step without the Government-General's permission. This is where the phrase national capital weighs the most."
 KOR_ind_regional_specialization: "Regional Specialization"
 KOR_ind_regional_specialization_desc: "The peninsula's industry laid out as a single map. Not a record of what is where but a decision about what goes where, and the places left out of it simply stay empty."
 KOR_ind_five_year_plan: "The Chosen Five-Year Plan"
 KOR_ind_five_year_plan_desc: "The Government-General begins planning the peninsula in five-year blocks. The moment the word plan is attached the numbers become targets, and targets are met by somebody."
 KOR_ind_gyeongin_belt: "The Gyeongin Industrial Belt"
 KOR_ind_gyeongin_belt_desc: "The peninsula's factories crowd the narrow corridor between Keijo and Chemulpo, because the port and the capital and the railway all sit within an hour of one another. Which also means that nowhere else can take over if it goes."
 KOR_ind_railway_double: "Double-Track the Railways"
 KOR_ind_railway_double_desc: "Two tracks where there was one, from Busan to Sinuiju. Doubled, the peninsula stops being a place and becomes the bridge between the islands and the mainland. A bridge is used by whoever is crossing it."
 KOR_ind_keijo_university: "Keijo University School of Science"
 KOR_ind_keijo_university_desc: "Keijo Imperial University opened in 1924 with faculties of law and medicine and nothing else. That Koreans were not taught engineering was not a budget decision. Opening the science faculty reverses it."
 KOR_ind_korea_in_world: "Korea in the World"
 KOR_ind_korea_in_world_desc: "What the peninsula makes begins leaving under its own name instead of passing through somebody else's. The overlord's cut falls as low as industry can push it, and it does not reach zero. The last of it is not an industrial problem."
 KOR_officer_census: "Census of Officers"
 KOR_officer_census_desc: "- political power +50\n- opens the two branches below\n- your officer count becomes visible"
 KOR_army_hq_accord: "Accord with the Korea Army HQ"
 KOR_army_hq_accord_desc: "- remove the national spirit 'Korea Army HQ Veto'\n- land doctrine research bonus 50%\n- division recruitment is unsealed\n- opinion of Japan +20"
