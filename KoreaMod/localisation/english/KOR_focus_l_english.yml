 KOR_japanese_trained_officers_desc: "- command power +20%\n- army experience +40\n- war support -5%"
 KOR_standing_divisions: "Raise Standing Divisions"
 KOR_standing_divisions_desc: "- division cap +6\n- infantry divisions +4\n- training speed +15%"
 KOR_artillery_logistics: "Artillery and Supply"
 KOR_artillery_logistics_desc: "- supply consumption -10%\n- artillery firepower +10%\n- support companies unlocked"
 KOR_sinheung_academy: "Rebuild the Sinheung Academy"
 KOR_sinheung_academy_desc: "- 'No Officer Corps' eased to stage 2 (-30%)\n- army experience +50\n- division cap 3→6"
 KOR_guerrilla_doctrine: "Establish a Guerrilla Doctrine"
 KOR_guerrilla_doctrine_desc: "- mountain and forest movement speed +15%\n- concealment +20%\n- night attack penalty -25%"
 KOR_uiyeoldan_legacy: "The Legacy of the Uiyeoldan"
 KOR_uiyeoldan_legacy_desc: "- special forces unlocked\n- special forces cap +30%\n- operative slot +1"
 KOR_manchurian_bases: "Bases on the Manchurian Border"
 KOR_manchurian_bases_desc: "- infantry divisions +3\n- supply consumption -15%\n- suppression of resistance in occupied states +20%"
 KOR_military_academy: "Found the Military Academy"
 KOR_military_academy_desc: "- 'No Officer Corps' eased to stage 3 (-10%)\n- division cap lifted\n- army experience +75\n- it can never be removed entirely"
 KOR_navy_ports: "Refit Chinnampo and Wonsan"
 KOR_navy_ports_desc: "- naval maintenance +10%\n- repair speed +25%\n- naval bases +2"
 KOR_navy_shipyard: "Expand Chosen Heavy Industries"
 KOR_navy_shipyard_desc: "- Fuzan dockyards +2\n- naval research speed +5%"
 KOR_coastal_flotilla: "The Coastal Defence Flotilla"
 KOR_coastal_flotilla_desc: "- destroyer research bonus 100%\n- destroyers 4 ships granted\n- coastal defence +20%"
 KOR_submarine_priority: "Submarines First"
 KOR_submarine_priority_desc: "- submarine research bonus 100%\n- submarines 3 ships granted\n- convoy raiding efficiency +15%"
 KOR_abandon_capitals: "Abandon the Capital Ships"
 KOR_abandon_capitals_desc: "- gain the national spirit 'Coastal Navy'\n- capital ships can never be built again\n- civilian factories +2\n- naval upkeep -50%"
 KOR_air_no_baek_rin: "The Legacy of No Paek-rin"
 KOR_air_no_baek_rin_desc: "- air research speed +5%\n- air experience +25"
 KOR_air_kwon_ki_ok: "Kwon Ki-ok and the Chinese Air Force"
 KOR_air_kwon_ki_ok_desc: "- 20 fighters granted\n- pilot experience +40\n- opinion of China +15"
 KOR_air_volunteers: "The International Volunteer Squadron"
 KOR_air_volunteers_desc: "- air experience +50\n- foreign pilot traits gained\n- air combat ability +10%"
 KOR_air_pyongyang_field: "Expand Pyongyang Airfield"
 KOR_air_pyongyang_field_desc: "- air bases +2\n- sortie rate +10%"
 KOR_seize_the_moment: "Seize the Moment"
 KOR_seize_the_moment_desc: "- the ideological fork opens again in full\n- you may switch even from the Naisen Ittai line\n- political power +200\n- war support +20%"
 KOR_disarm_governorate: "Disarm the Governor-General"
 KOR_disarm_governorate_desc: "- infantry equipment 5,000 seized\n- the police forces are absorbed\n- infantry divisions +4"
 KOR_assume_administration: "Assume the Administration"
 KOR_assume_administration_desc: "- stability +10%\n- resistance -20%\n- a body of civil servants secured\n- consumer goods -5%"
 KOR_declare_government: "Declare the Government"
 KOR_declare_government_desc: "- a government is formed at once\n- stability +10%\n- recognition +20"
 KOR_self_defense_corps: "Organize Self-Defence Corps"
 KOR_self_defense_corps_desc: "- militia divisions +6\n- equipment shortage penalty\n- manpower -2%"
 KOR_committee_autonomy: "Autonomy of the People's Committees"
 KOR_committee_autonomy_desc: "- resistance in occupied states +30%\n- stability +5%\n- local administration secured"
 KOR_anti_trusteeship_movement: "The Anti-Trusteeship Movement"
 KOR_anti_trusteeship_movement_desc: "- compliance under the occupier -25%\n- world tension +3%\n- war support +15%"
 KOR_separate_government: "Establish a Separate Government"
 KOR_separate_government_desc: "- immediate independence over half the peninsula\n- stability -20%\n- gives the other camp a claim to unify"
 KOR_infiltrate_hq: "Infiltrate the Headquarters"
 KOR_infiltrate_hq_desc: "- intelligence operations +2 slot\n- permanent intelligence on Japanese divisions in Korea\n- political power -100"
 KOR_prepare_arsenals: "Prepare to Seize the Arsenals"
 KOR_prepare_arsenals_desc: "- infantry equipment 5,000 set aside\n- field guns 300 set aside\n- if discovered, the whole cache is lost"
 KOR_keijo_uprising: "The Keijo Uprising"
 KOR_keijo_uprising_desc: "- the Korea Army HQ is neutralised at once\n- Keijo, Pyongyang and Fuzan occupied at once\n- immediate war with Japan\n- war support +30%"
