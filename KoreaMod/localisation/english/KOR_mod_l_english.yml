 ### game rules ###
 RULE_GROUP_KOR: "Korea"
 RULE_KOR_DIFFICULTY: "Korea's Strength"
 RULE_KOR_DIFFICULTY_DESC: "The argument between historical accuracy and playability is settled on this screen, not by the designer. The focus tree is identical in all three; only the starting numbers move."
 RULE_KOR_DIFFICULTY_HISTORICAL: "Historical"
 RULE_KOR_DIFFICULTY_HISTORICAL_DESC: "50% of output leaks to the overlord, the officer penalty is at full, three divisions at a time. Surviving to the end of the war is the goal."
 RULE_KOR_DIFFICULTY_BALANCED: "Balanced"
 RULE_KOR_DIFFICULTY_BALANCED_DESC: "35% leak, half the officer penalty, +3 civilian factories. An Eastern European minor."
 RULE_KOR_DIFFICULTY_EMPOWERED: "Empowered"
 RULE_KOR_DIFFICULTY_EMPOWERED_DESC: "No leak, no officer penalty, a lot more industry. Poland-sized - for multiplayer or a first game."
 RULE_KOR_START_MODE: "The Peninsula at Game Start"
 RULE_KOR_START_MODE_DESC: "Whether the 1936 map is touched at all. This is the only setting that affects Japan."
 RULE_KOR_START_MODE_LIBERATION: "Releasable Only (safe)"
 RULE_KOR_START_MODE_LIBERATION_DESC: "The map is left alone. The peninsula stays Japanese, Korea stays a releasable nation, and the focus tree runs once Korea exists. Japan's AI is untouched."
 RULE_KOR_START_MODE_GOVERNORATE: "Government-General (default)"
 RULE_KOR_START_MODE_GOVERNORATE_DESC: "The design's original intent. Both Korean states are split off to the CHO tag as an integrated puppet of Japan. Japan is compensated with a national spirit, but its conduct of the war in China may suffer."

