 ### starting national spirits ###
 KOR_colonial_supply_base: "Colonial Supply Base"
 KOR_colonial_supply_base_desc: "The peninsula is not land to build factories on. It is land to ship things from. Construction and extraction are quick, and half of what comes out does not stay.\n\nCurrent leak: §R[?KOR_leak_display|0]%§!\nEvery completed industry focus claws back 5 percentage points."
 KOR_manpower_extraction: "Requisition of Human Resources"
 KOR_manpower_extraction_desc: "Labour conscription has taken the young men off the peninsula. The population is here; the hands are not."
 KOR_governorate_police: "Governorate Police State"
 KOR_governorate_police_desc: "The police arrive before the politics. Resistance is held down, and so is anything that could be called political life."
 KOR_divided_movement: "A Divided Independence Movement"
 KOR_divided_movement_desc: "Chongqing, Yan'an, Khabarovsk and Honolulu are saying different things."
 KOR_army_hq_veto: "Korea Army HQ Veto"
 KOR_army_hq_veto_desc: "The Chosen Army Headquarters holds every military decision on the peninsula. Sign an accord with it, or drive it out.\n\nThe base game has no modifier that forbids raising divisions, so the lock is written as penalties heavy enough that nobody tries."
 KOR_colonial_education: "Colonial Education System"
 KOR_colonial_education_desc: "There is, in practice, exactly one institution of higher technical education."
 KOR_colonial_education_eased: "Colonial Education System (eased)"
 KOR_colonial_education_eased_desc: "The Keijo University science faculty has opened. Still thin, but no longer what it was."
 KOR_officer_shortage_1: "No Officer Corps"
 KOR_officer_shortage_1_desc: "The manpower is French-sized and there is nobody to command it. This eases in three stages and never disappears entirely. (Stage 1)"
 KOR_officer_shortage_2: "No Officer Corps (Stage 2)"
 KOR_officer_shortage_2_desc: "The academy has reopened. Still short, better than before."
 KOR_officer_shortage_3: "No Officer Corps (Stage 3)"
 KOR_officer_shortage_3_desc: "A military academy stands. This is as far as it goes - it never disappears entirely."

 ### spirits granted by focuses ###
 KOR_imperial_dominion: "Dominion within the Empire"
 KOR_imperial_dominion_desc: "Not an independent state. No longer an administrative district either."
 KOR_north_china_base: "North China Base Area"
 KOR_north_china_base_desc: "A whole mountain range used as a base."
 KOR_samgyunism: "The Three Equalities"
 KOR_samgyunism_desc: "Equality in politics, economy and education. The KPG's founding programme."
 KOR_shadow_of_the_throne: "Shadow of the Throne"
 KOR_shadow_of_the_throne_desc: "A dynasty without a king still sits in living memory."
 KOR_national_capital: "Korean Capital Cooperates"
 KOR_national_capital_desc: "Kyungsung Spinning and Hwashin have opened their books."
 KOR_coastal_navy: "Coastal Navy"
 KOR_coastal_navy_desc: "A peninsula that has decided not to build a fleet. Destroyers and below."
 KOR_peoples_committees: "Nationwide People's Committees"
 KOR_peoples_committees_desc: "They did not pick up rifles first. They took the administration first."
 JAP_korean_integration: "Integration of Chosen"
 JAP_korean_integration_desc: "The peninsula has been split off as an integrated puppet; its manpower and industrial share flow back to the metropole."

 KOR_survey_effort: "Resource Survey"
 KOR_survey_effort_desc: "Know first what is buried where."
 KOR_underground_cells: "The Underground Network"
 KOR_underground_cells_desc: "With no legal party, what remains is cells."
 KOR_education_drive: "Revised Education Ordinance"
 KOR_education_drive_desc: "What is taught is prescribed, but it is taught."
 KOR_labor_conscription: "National Labour Requisition"
 KOR_labor_conscription_desc: "Nobody is asked."
 KOR_restoration_army_spirit: "The Restoration Army"
 KOR_restoration_army_spirit_desc: "An army that never reached establishment. Still an army."
 KOR_yanan_logistics: "Yan'an Supply Line"
 KOR_yanan_logistics_desc: "Eat little, walk far."
 KOR_taihang_base: "The Taihang Base"
