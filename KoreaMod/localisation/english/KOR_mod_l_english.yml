 ### events ###
 korea_triggers.1.t: "The Erased Sun"
 korea_triggers.1.d: "A newspaper printed a photograph of the young man who had won the marathon in Berlin. The rising sun on his chest had been painted out.\n\nThe Governor-General suspended the paper. The editors were arrested. What was erased was a flag; what people saw was whatever should have been in its place.\n\nWhich side you take here decides which roads open at all."
 korea_triggers.1.a: "Side with the Governor-General."
 korea_triggers.1.b: "Defend the paper."
 korea_triggers.1.c: "Say nothing."
 korea_triggers.2.t: "The Cairo Declaration"
 korea_triggers.2.d: "Three powers announced their determination that Korea shall become free and independent.\n\nThe wording was 'in due course'. The Philippines had a date written down: 1946. Korea got an adverbial phrase.\n\nThat phrase decides the next several years."
 korea_triggers.2.a: "There is no date. We will supply one."
 korea_triggers.2.b: "The Empire does not recognise this declaration."

 korea_politics.3.t: "The Left-Right Talks"
 korea_politics.3.d: "Chongqing and Yan'an are in the same room. They have the same enemy and are drawing different countries."
 korea_politics.3.a: "One of them has to be chosen."
 korea_politics.4.t: "Chairman of the Provisional Government"
 korea_politics.4.d: "Rhee is in Washington and Kim Ku is in Chongqing. The first is better at winning recognition; the second is better at gathering people."
 korea_politics.4.a: "Keep Rhee."
 korea_politics.4.b: "Raise up Kim Ku."
 korea_politics.5.t: "Return of the Royal House"
 korea_politics.5.d: "Two men could come home.\n\nPrince Yi Un is a lieutenant general in the Imperial Japanese Army. What he founds will not be an independent state but a dominion inside the empire.\n\nPrince Yi Kang was once caught trying to escape to Shanghai. Under him the dynasty would be a symbol and nothing more."
 korea_politics.5.a: "Prince Yi Un."
 korea_politics.5.b: "Prince Yi Kang."
 korea_politics.6.t: "The Empire Re-proclaimed"
 korea_politics.6.d: "The constitution of 1899 is read out again. The articles are unchanged; the people reading them are not."
 korea_politics.6.a: "Proclaim it."

 korea_industry.1.t: "The Chosen Five-Year Plan"
 korea_industry.1.d: "Exactly the structure Manchukuo used. Pick one of three; the other two stay locked for the length of the plan."
 korea_industry.1.a: "Heavy chemical - Hungnam as the axis."
 korea_industry.1.b: "Munitions - used as soon as they are made."
 korea_industry.1.c: "Aviation - assembly only."

 korea_triggers.3.t: "The Rear"
 korea_triggers.3.d: "A shot at a bridge outside Beijing, and within three days the front had opened across the whole of north China.\n\nWhat changed on the peninsula was not the map but the purpose. What is dug here, what is made here, and in time who is born here, is counted again as material to be shipped across the water.\n\nThe Government-General called it turning Korea into a supply base. That was not the wrong word."
 korea_triggers.3.a: "Serve the rear."
 korea_triggers.3.b: "The longer the front, the emptier what stands behind it."
 korea_triggers.3.c: "Put our name to neither."
 korea_triggers.4.t: "Declaration of War on Japan"
 korea_triggers.4.d: "One day after Pearl Harbor, the Provisional Government in Chongqing declared war on Japan.\n\nIts army is a few detachments of the Restoration Army, and those take their orders from the Chinese. The declaration is a document all the same, and it takes a document to claim a seat later.\n\nOn the peninsula the blackout began the same day."
 korea_triggers.4.a: "Declare it. The paper does the rest."
 korea_triggers.4.b: "The empire's war becomes our war."
 korea_triggers.4.c: "The war reaches here either way."
 korea_triggers.5.t: "The Korean Language Society"
 korea_triggers.5.d: "The men compiling the dictionary have been arrested. The charge is sedition.\n\nBy the standards of 1942 the charge is not wrong: a dictionary is made on the assumption that someone will still be there to read the words.\n\nThe manuscript is still at the printer's."
 korea_triggers.5.a: "Hide the manuscript."
 korea_triggers.5.b: "Hand the society over."
 korea_triggers.6.t: "Conscription"
 korea_triggers.6.d: "The Government-General has taken out what it put off for thirty years, because putting a rifle in the colony's hands is the one thing that cannot be taken back.\n\nThere is no room left to put it off. The first notices have reached the district offices.\n\nWhere the young men who receive them go is not yet settled."
 korea_triggers.6.a: "Fill the quota."
 korea_triggers.6.b: "Send them to the hills."
 korea_triggers.6.c: "Let it fall where it falls."
 korea_industry.2.t: "Sup'ung Goes Live"
 korea_industry.2.d: "The dam across the Yalu has begun to generate. Outside the Tennessee Valley it is the largest in the world, and the number of labourers conscripted to build it depends on which record you read.\n\nThe lines run in two directions: one to Hungnam and Kyomipo, one across the strait."
 korea_industry.2.a: "Send it to the metropole."
 korea_industry.2.b: "Keep it on the peninsula."
 korea_politics.7.t: "The Assembly's Last Day"
 korea_politics.7.d: "The metropole has fallen. The assembly was raised under imperial law, and what guaranteed that law stopped existing today.\n\nOutside, the People's Committees are already taking the provincial offices and the police stations. Among the men in red armbands are some who worked in this building yesterday.\n\nWhat is left is whether to hand it over, or to buy a few more days with the bayonets that remain."
 korea_politics.7.a: "Hand it to the committees."
 korea_politics.7.b: "Hold with what is left."
 KOR_dominion_fallen_tt: "§RThe dominion is dissolved.§!"
 KOR_rear_base_mobilisation: "Rear Mobilisation"
 KOR_rear_base_mobilisation_desc: "The peninsula's factories no longer turn for the peninsula. Building is faster; what is built does not stay."
 KOR_conscripted_class: "The Conscripted Class"
 KOR_conscripted_class_desc: "Every district office has a list. The men on it go to the depot; the men who wrote it have to go on living in the village."
 KOR_bayonet_authority: "Authority by Bayonet"
 KOR_bayonet_authority_desc: "It is no longer law that backs the orders. They are still obeyed because the bayonets are still there."
 KOR_sponsor_strain: "Diverted the Current"
 KOR_allied_standing: "Allied Standing"
 KOR_allied_standing_desc: "Being a government somebody has heard of is worth something in the room. It scales with the recognition gauge and is worth nothing at zero."
 KOR_united_front_strain: "Strain on the United Front"
 KOR_united_front_strain_desc: "The scale sits at fifty and costs nothing there. Every point it is pushed either way is a point of the movement that has stopped listening, paid for in the zeal of the half that remains."
 KOR_military_academy_idea: "The Military Academy"
 KOR_military_academy_idea_desc: "There is somewhere to make officers now. Late, but there."
 KOR_failed_entry: "Scattered Units"
 KOR_failed_entry_desc: "The entry into the homeland failed. The men who went in did not come back."

 ### dynamic modifiers ###
 KOR_supply_base_leak: "Siphoned to the Overlord"
 KOR_supply_base_leak_desc: "The share of output that leaves for the home islands. Every completed industry focus cuts it by five percentage points."

 KOR_show_scale: "The Left-Right Scale"
 KOR_show_scale_desc: "Right §Y[?KOR_scale_right|0]§! - left §Y[?KOR_scale_left|0]§!. They always sum to 100.\n\nIf either side passes 80 the other camp walks out and a civil war check begins. The unification talks only open between 40 and 60."
 KOR_awaits_incident_loyalist_tt: "This branch opens only if you side with the Governor-General, or say nothing, at the §Yflag-defacement incident of 25 August 1936§!."
 KOR_awaits_incident_resistance_tt: "This branch opens only if you defend the paper, or say nothing, at the §Yflag-defacement incident of 25 August 1936§!."
 KOR_bandit_cost_tt_blocked: "Needs 10 command power (not enough)"
